<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <title>双域名分工与自定义域名的真相</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">双域名分工：io 主站 + dev 视频仓库</text>

  <!-- io 节点 -->
  <rect x="40" y="90" width="300" height="170" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#7dd3fc">lycaonide.github.io（io）</text>
  <text x="190" y="145" text-anchor="middle" font-size="12" fill="#94a3b8">GitHub Pages · 主站</text>
  <text x="190" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">用户访问 / 微信分享的域名</text>
  <text x="190" y="195" text-anchor="middle" font-size="12" fill="#94a3b8">支持 Range（206）但国内线路慢</text>
  <text x="190" y="220" text-anchor="middle" font-size="12" fill="#94a3b8">页面跨域拉取 dev 的分片</text>
  <text x="190" y="245" text-anchor="middle" font-size="12" fill="#94a3b8">自身也保留 mp4 / 分片兜底</text>

  <!-- 箭头：io -> dev -->
  <line x1="340" y1="175" x2="430" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="385" y="162" text-anchor="middle" font-size="12" fill="#fbbf24">跨域请求</text>
  <text x="385" y="195" text-anchor="middle" font-size="11.5" fill="#94a3b8">CORS ✓</text>

  <!-- dev 节点 -->
  <rect x="435" y="90" width="300" height="170" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="585" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">my-firefly-blog.pages.dev（dev）</text>
  <text x="585" y="145" text-anchor="middle" font-size="12" fill="#94a3b8">Cloudflare Pages · 视频仓库</text>
  <text x="585" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">国内下载快（实测约 833KB/s）</text>
  <text x="585" y="195" text-anchor="middle" font-size="12" fill="#94a3b8">不支持 Range，但分片无需 Range</text>
  <text x="585" y="220" text-anchor="middle" font-size="12" fill="#94a3b8">存放 m3u8 + 41 个 ts 分片</text>
  <text x="585" y="245" text-anchor="middle" font-size="12" fill="#94a3b8">_headers 配置 CORS 允许跨域</text>

  <!-- 用户节点 -->
  <rect x="820" y="90" width="150" height="170" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="895" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">访客</text>
  <text x="895" y="150" text-anchor="middle" font-size="12" fill="#94a3b8">手机 / 电脑 / 微信</text>
  <text x="895" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">打开 io 主站</text>
  <text x="895" y="200" text-anchor="middle" font-size="12" fill="#94a3b8">点击播放背景视频</text>
  <text x="895" y="225" text-anchor="middle" font-size="12" fill="#94a3b8">分片从 dev 快速拉取</text>

  <!-- 访客 -> io -->
  <line x1="970" y1="60" x2="970" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="1005" y="78" font-size="11.5" fill="#94a3b8">访问</text>

  <!-- 底部：自定义域名 -->
  <rect x="40" y="290" width="920" height="160" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="318" font-size="15" font-weight="700" fill="#cbd5e1">那自定义域名呢？—— 只是换个"门牌号"</text>
  <text x="60" y="345" font-size="12.5" fill="#94a3b8">自定义域名 = 把 lycaonide.github.io 绑成你自己的域名（如 lycaonide.com），访问时底层仍是同一台 GitHub / Cloudflare 服务器：</text>
  <text x="60" y="370" font-size="12.5" fill="#94a3b8">• 服务器是否支持 Range → 不变（这是平台能力，与域名无关）</text>
  <text x="60" y="395" font-size="12.5" fill="#94a3b8">• 国内线路快慢 → 不变（域名不改变服务器所在线路）</text>
  <text x="60" y="420" font-size="12.5" fill="#fbbf24">结论：仅换域名解决不了视频问题。真正能让 mp4 直接边下边播的条件 = 自定义域名 + 托管到"支持 Range 且国内快"的平台（如国内对象存储 + CDN）。</text>
</svg>
