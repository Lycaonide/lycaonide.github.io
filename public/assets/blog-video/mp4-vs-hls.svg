<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <title>mp4 单文件 vs HLS 分片</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="mp4file" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="hlsseg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="arrowG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="660" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="500" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">为什么 mp4 会卡 / 变"下载界面"，而 HLS 不会</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#94a3b8">同一个视频，两种分发方式 —— 区别在"下载方式"，不在文件本身</text>

  <!-- ============ 左：mp4 单文件 ============ -->
  <rect x="40" y="105" width="440" height="340" rx="18" fill="#1e1b2e" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="105" width="440" height="52" rx="18" fill="#f87171" opacity="0.12"/>
  <text x="60" y="128" font-size="12" fill="#fca5a5" font-weight="700">⚠ 情况一：mp4 单文件 · 托管不支持 Range</text>
  <text x="60" y="148" font-size="13" fill="#e2e8f0">浏览器要"边下边播"必须依赖 HTTP Range 请求，</text>
  <text x="60" y="167" font-size="13" fill="#e2e8f0">服务器却只肯整包返回 → 只能下完才能播。</text>

  <!-- mp4 文件条 -->
  <rect x="60" y="192" width="400" height="34" rx="10" fill="url(#mp4file)" opacity="0.9"/>
  <text x="260" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">firefly.mp4 · 15MB · 245s</text>

  <!-- 整包下载进度 -->
  <text x="60" y="262" font-size="12.5" fill="#cbd5e1">下载进度</text>
  <rect x="60" y="274" width="400" height="14" rx="7" fill="#1e293b"/>
  <rect x="60" y="274" width="400" height="14" rx="7" fill="#f87171" opacity="0.85"/>
  <text x="500" y="286" text-anchor="middle" font-size="11" fill="#fca5a5" font-weight="700">100% 整包下完才播放</text>

  <!-- 表现 -->
  <rect x="60" y="310" width="400" height="62" rx="10" fill="#7f1d1d" opacity="0.35"/>
  <text x="76" y="336" font-size="12.5" fill="#fecaca">📱 手机/微信：显示"下载界面"，点不开</text>
  <text x="76" y="358" font-size="12.5" fill="#fecaca">💻 电脑：点播放后十几秒无反应</text>

  <!-- 卡点标记 -->
  <text x="260" y="425" text-anchor="middle" font-size="14" fill="#f87171" font-weight="700">卡在"整包下载"，文件大小与网络都要背锅</text>

  <!-- ============ 右：HLS 分片 ============ -->
  <rect x="520" y="105" width="440" height="340" rx="18" fill="#0e2a22" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="520" y="105" width="440" height="52" rx="18" fill="#34d399" opacity="0.12"/>
  <text x="540" y="128" font-size="12" fill="#6ee7b7" font-weight="700">✅ 情况二：HLS 分片 · 不依赖 Range</text>
  <text x="540" y="148" font-size="13" fill="#e2e8f0">把视频切成 41 个小分片（每个约 355KB），</text>
  <text x="540" y="167" font-size="13" fill="#e2e8f0">播放器一次只拉几片，播到哪、拉到哪。</text>

  <!-- 分片网格：41 片示意（8 列 × 5 行 + 1） -->
  <text x="540" y="200" font-size="12.5" fill="#cbd5e1">41 个分片 · 每个都是完整小文件（服务器直接返回，无需 Range）</text>
  <g font-size="0">
    <!-- 已加载：前 8 片亮绿 -->
    <g>
      <rect x="540" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="590" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="640" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="690" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="740" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="790" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="840" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
      <rect x="890" y="212" width="44" height="26" rx="5" fill="url(#hlsseg)"/>
    </g>
    <!-- 播放光标 -->
    <rect x="920" y="206" width="6" height="38" rx="3" fill="#fbbf24"/>
    <!-- 未加载 -->
    <g opacity="0.45">
      <rect x="540" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="590" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="640" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="690" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="740" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="790" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="840" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="890" y="244" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="540" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="590" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="640" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="690" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="740" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="790" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="840" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="890" y="276" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="540" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="590" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="640" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="690" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="740" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="790" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="840" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
      <rect x="890" y="308" width="44" height="26" rx="5" fill="#134e4a"/>
    </g>
  </g>

  <!-- 表现 -->
  <rect x="540" y="342" width="400" height="62" rx="10" fill="#064e3b" opacity="0.4"/>
  <text x="556" y="368" font-size="12.5" fill="#a7f3d0">⚡ 点击播放 1-2 秒出画面（先拉前几片）</text>
  <text x="556" y="390" font-size="12.5" fill="#a7f3d0">📲 手机/微信、电脑都能播，不再出现下载界面</text>

  <text x="740" y="425" text-anchor="middle" font-size="14" fill="#34d399" font-weight="700">分片按需拉取 = 天然免疫"不支持 Range"</text>

  <!-- ============ 底部：对比结论 ============ -->
  <rect x="40" y="470" width="920" height="150" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="505" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">一句话对比</text>

  <text x="80" y="545" font-size="13.5" fill="#e2e8f0">🎬 mp4 单文件：一次请求整包 → 依赖服务器 Range → 不支持就"下完才播"（卡顿 / 下载界面）</text>
  <text x="80" y="575" font-size="13.5" fill="#e2e8f0">🧩 HLS 分片：切成 41 个小文件逐个拉取 → 每个都是完整响应 → 不需要 Range，天然免疫</text>
  <text x="80" y="605" font-size="13.5" fill="#93c5fd">🏭 YouTube / B 站 / Netflix 网页播放都是分片思路 —— 这是行业标准做法，不是 hack</text>
</svg>
