<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <title>背景视频播放链路（最终形态）</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="alt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="alt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="last" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>

  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">背景视频播放链路（最终形态）</text>
  <text x="500" y="72" text-anchor="middle" font-size="13.5" fill="#94a3b8">按优先级依次尝试：成功就停，失败才走下一步，全部失败才退回图片壁纸</text>

  <!-- ============ 节点 1：HLS 分片（主） ============ -->
  <g filter="url(#shadow)">
    <rect x="30" y="120" width="205" height="190" rx="16" fill="#0e2a22" stroke="#34d399" stroke-width="2"/>
    <circle cx="132" cy="160" r="30" fill="url(#main)"/>
    <text x="132" y="169" text-anchor="middle" font-size="24">🧩</text>
    <text x="132" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#6ee7b7">HLS 分片</text>
    <text x="132" y="232" text-anchor="middle" font-size="12" fill="#a7f3d0">主链路 · 行业标准</text>
    <text x="132" y="258" text-anchor="middle" font-size="11.5" fill="#cbd5e1">m3u8 + 41 个 .ts 分片</text>
    <text x="132" y="276" text-anchor="middle" font-size="11.5" fill="#cbd5e1">懒加载 hls.js 播放</text>
    <rect x="50" y="292" width="164" height="10" rx="5" fill="#34d399"/>
    <text x="132" y="316" text-anchor="middle" font-size="11.5" fill="#6ee7b7" font-weight="700">✅ 成功即播放</text>
  </g>

  <line x1="240" y1="215" x2="275" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="258" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">失败</text>

  <!-- ============ 节点 2：mp4 单文件（备 1） ============ -->
  <g filter="url(#shadow)">
    <rect x="280" y="120" width="205" height="190" rx="16" fill="#0c1a2e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="382" cy="160" r="30" fill="url(#alt1)"/>
    <text x="382" y="169" text-anchor="middle" font-size="24">🎬</text>
    <text x="382" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#7dd3fc">mp4 单文件</text>
    <text x="382" y="232" text-anchor="middle" font-size="12" fill="#bae6fd">备用 ① · Range 兜底</text>
    <text x="382" y="258" text-anchor="middle" font-size="11.5" fill="#cbd5e1">HLS 致命错误时降级</text>
    <text x="382" y="276" text-anchor="middle" font-size="11.5" fill="#cbd5e1">仍失败继续向下</text>
    <rect x="300" y="292" width="164" height="10" rx="5" fill="#38bdf8"/>
    <text x="382" y="316" text-anchor="middle" font-size="11.5" fill="#7dd3fc" font-weight="700">⚠ 失败则继续</text>
  </g>

  <line x1="490" y1="215" x2="525" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="508" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">失败</text>

  <!-- ============ 节点 3：备用源（备 2） ============ -->
  <g filter="url(#shadow)">
    <rect x="530" y="120" width="205" height="190" rx="16" fill="#2a2208" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="632" cy="160" r="30" fill="url(#alt2)"/>
    <text x="632" y="169" text-anchor="middle" font-size="24">🔁</text>
    <text x="632" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#fcd34d">备用源</text>
    <text x="632" y="232" text-anchor="middle" font-size="12" fill="#fde68a">备用 ② · 双平台互备</text>
    <text x="632" y="258" text-anchor="middle" font-size="11.5" fill="#cbd5e1">io 挂了走 dev</text>
    <text x="632" y="276" text-anchor="middle" font-size="11.5" fill="#cbd5e1">dev 挂了走 io</text>
    <rect x="550" y="292" width="164" height="10" rx="5" fill="#fbbf24"/>
    <text x="632" y="316" text-anchor="middle" font-size="11.5" fill="#fcd34d" font-weight="700">⚠ 失败则继续</text>
  </g>

  <line x1="740" y1="215" x2="775" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="758" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">失败</text>

  <!-- ============ 节点 4：图片壁纸（兜底） ============ -->
  <g filter="url(#shadow)">
    <rect x="780" y="120" width="190" height="190" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="875" cy="160" r="30" fill="url(#last)"/>
    <text x="875" y="169" text-anchor="middle" font-size="24">🖼️</text>
    <text x="875" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#cbd5e1">图片壁纸</text>
    <text x="875" y="232" text-anchor="middle" font-size="12" fill="#94a3b8">最终兜底 · 永不空白</text>
    <text x="875" y="258" text-anchor="middle" font-size="11.5" fill="#cbd5e1">任何网络下都有</text>
    <text x="875" y="276" text-anchor="middle" font-size="11.5" fill="#cbd5e1">内容可看</text>
    <rect x="800" y="292" width="150" height="10" rx="5" fill="#94a3b8"/>
    <text x="875" y="316" text-anchor="middle" font-size="11.5" fill="#94a3b8" font-weight="700">🏁 到此为止</text>
  </g>

  <!-- 底部备注 -->
  <text x="500" y="382" text-anchor="middle" font-size="12.5" fill="#64748b">hls.js 约 605KB，点击播放时才加载（懒加载），不拖慢首屏</text>
</svg>
