<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习打卡 · 考研进度管理</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232EA88C'/%3E%3Cpath d='M9 12l2 2 4-4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{--brand:#2EA88C;--ink:#1B2B27;--muted:#6B7F7A;--bg:#F5FAF9}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .card{max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #E3EFEB;
    border-radius:20px;padding:32px 26px;box-shadow:0 12px 32px rgba(46,168,140,.08)}
  .icon{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;
    background:linear-gradient(135deg,#2EA88C,#3FC0A4);display:flex;align-items:center;justify-content:center}
  h1{font-size:19px;font-weight:600;letter-spacing:.3px}
  p{margin-top:10px;font-size:14px;line-height:1.7;color:var(--muted)}
  a.btn{display:block;margin-top:22px;padding:14px 18px;border-radius:14px;background:var(--brand);
    color:#fff;text-decoration:none;font-size:15px;font-weight:600;min-height:48px;line-height:20px}
  a.btn:active{transform:translateY(1px)}
  .hint{margin-top:14px;font-size:12px;color:#9AAFA9}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
    </div>
    <h1>正在打开学习打卡台</h1>
    <p>如果你的浏览器没有自动跳转，点下面的按钮。<br>用手机浏览器打开后，可以「添加到主屏幕」当 APP 用。</p>
    <a class="btn" id="go" href="https://workbuddy.link/p/Pir0aS42QyX4rm6dVeuvUb">打开学习打卡台</a>
    <p class="hint">数据在线存储，换设备打开进度都在</p>
  </div>
<script>
  // 顶层跳转而不是 iframe：跨站 iframe 会丢第三方 Cookie，导致认不出登录态、弹扫码
  var target = "https://workbuddy.link/p/Pir0aS42QyX4rm6dVeuvUb";
  try { window.location.replace(target); } catch (e) {}
</script>
</body>
</html>
