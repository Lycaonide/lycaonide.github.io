<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>学习打卡 · 考研进度管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232EA88C'/%3E%3Cpath d='M9 12l2 2 4-4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#2563EB;--brand2:#1D4ED8;--brand-ink:#1E40AF;
  --ink:#0F172A;--ink2:#475569;--muted:#64748B;
  --bg:#FFFFFF;--card:#FFFFFF;--line:#CBD5E1;--line2:#B9C6D6;--line-soft:#E8EDF4;
  --amber:#E8A33D;--red:#E25B5B;--blue:#2563EB;--green:#16A34A;--rose:#E882B0;
  --grad:#2563EB;
  --grad-soft:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 10px 28px -14px rgba(15,23,42,.22);
  --r-lg:10px;--r-md:8px;--r-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
::selection{background:rgba(43,108,230,.16)}

/* ===== 外壳 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:252px;flex:none;background:#F8FAFC;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:0 6px 22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.back-link{position:fixed;bottom:18px;left:196px;display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0;background:transparent;color:var(--muted);text-decoration:none;font-size:16px;font-weight:500;z-index:10}
.back-link:hover{color:var(--brand)}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{width:17px;height:17px;stroke:#fff}
.brand h1{font-size:24px;font-weight:700;letter-spacing:0;white-space:nowrap;color:var(--ink)}
.brand h1 em{font-style:normal;color:var(--brand-ink)}
.date{font-size:14px;color:var(--muted);padding:0 6px 18px;white-space:nowrap;align-self:flex-start}

/* ===== Tab 栏 ===== */
.tabs{display:flex;flex-direction:column;gap:2px}
.tab-btn{min-height:44px;border-radius:9px;font-size:16px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:11px;padding:0 13px;transition:color .15s,background .15s;text-align:left}
.tab-btn:hover{background:#EEF2F7;color:var(--ink)}
.tab-btn.active{background:var(--brand);color:#fff;font-weight:700}
.tab-btn svg{width:20px;height:20px;flex:none;opacity:.85}
.tab-btn.active svg{opacity:1}

/* ===== 主区 ===== */
main{flex:1;min-width:0;padding:28px 36px calc(52px + env(safe-area-inset-bottom))}
main > *{max-width:1320px;margin-left:auto;margin-right:auto}
@media(min-width:1700px){main > *{max-width:1480px}}

@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:column;gap:8px;padding:10px 14px;border-right:none;border-bottom:1px solid var(--line);z-index:20}
  .sb-brand{flex-direction:row;align-items:center;justify-content:space-between;padding:0 0 8px;gap:10px}
  .back-link{position:static;order:2;font-size:14px;color:var(--muted)}
  .brand{order:1}
  .brand h1{font-size:19px}
  .date{display:none}
  .tabs{flex-direction:row;gap:4px}
  .tab-btn{flex:1;justify-content:center;padding:0;min-height:42px;font-size:14px;gap:6px}
  .tab-btn svg{width:17px;height:17px}
  main{padding:12px 12px calc(80px + env(safe-area-inset-bottom))}
}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card h3{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--ink);line-height:1.35}
.card h3::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--brand);flex:none}

/* 每日一句 */
.quote{position:relative;background:transparent;border:none;border-bottom:1px solid var(--line);padding:0 0 16px;overflow:hidden;margin-bottom:16px}
.quote .qtext{font-size:22px;font-weight:700;color:var(--ink);line-height:1.45;letter-spacing:0}
.quote::before{content:"\201C";position:absolute;right:12px;top:-14px;font-size:92px;line-height:1;color:rgba(37,99,235,.13);font-family:Georgia,serif;pointer-events:none}
.quote .q{font-size:16px;line-height:1.8;font-weight:500;color:var(--ink2)}
.quote .qtag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:600;color:var(--brand);background:#EDF3FE;border-radius:6px;padding:3px 9px;letter-spacing:.6px}

/* 漏卡提示 */
.miss{--mcol:var(--amber);background:#FFFBF1;border-color:#EFD3A4}
.miss.red{--mcol:var(--red);background:#FFF5F4;border-color:#F2C9C6}
.miss-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.miss-head b{font-size:15px;font-weight:700}
.miss-dot{width:9px;height:9px;border-radius:50%;background:var(--mcol);flex:none;box-shadow:0 0 0 4px rgba(232,163,61,.16)}
.miss p{font-size:15px;color:var(--ink2)}
.miss-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ===== 目标卡 ===== */
.gcard{--gc:var(--brand)}
/* 标题行：科目名在左，后面这组（博客笔记 / 完成率 / 连续 / 预计 / 状态）统一间距、整体靠右 */
.ghead{display:flex;align-items:center;gap:10px 24px;flex-wrap:wrap;justify-content:flex-end}
.gdot{width:11px;height:11px;border-radius:4px;background:var(--gc);flex:none}
.gname{font-size:22px;font-weight:700;flex:0 1 auto;min-width:0;max-width:42%;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.gname .gtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:15px;font-weight:700;padding:4px 11px;border-radius:999px;flex:none;letter-spacing:.2px}
.blink{font-size:16px;font-weight:600;color:var(--muted);text-decoration:none;flex:none;padding:2px 0;white-space:nowrap}
.blink:hover{color:var(--brand)}
.chip.ok{background:#DCFCE7;color:#15803D}
.chip.info{background:#DBEAFE;color:#1D4ED8}
.chip.warn{background:#FEF0C7;color:#B45309}
.chip.bad{background:#FEE2E2;color:#B91C1C}
.chip.arch{background:#F1F5F9;color:#64748B}
.gbar{height:10px;border-radius:99px;background:#E7ECF3;margin:12px 0 14px;overflow:hidden;position:relative}
.gfill{height:100%;border-radius:99px;background:var(--gc);transition:width .35s cubic-bezier(.22,.61,.36,1);position:relative}
.gfill::after{content:none}
/* 标题行的四段摘要：博客笔记 / 完成率 / 连续 / 预计，统一间距、整体靠右 */
.gs{font-size:16px;color:#5B6B80;font-weight:600;white-space:nowrap;letter-spacing:.1px}
.gs b{font-size:18px;color:var(--ink);font-weight:700;margin-left:5px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.gs b small{font-size:16px;font-weight:600;color:#5B6B80;margin-left:2px}
/* 「暂无推算」是文字不是数字，比数字位收 2px，免得抢眼 */
.gs b.et-none{font-size:16px;font-weight:600}
@media(max-width:1400px){.ghead{gap:10px 20px}}
@media(max-width:1320px){.ghead{gap:10px 12px}}
.gact{display:grid;grid-template-columns:128px 1fr 96px;gap:14px;align-items:end;margin-top:18px}
.gact .field label{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:7px;white-space:nowrap}
.gact input{width:100%;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:#fff;min-height:40px;font-size:15px;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.gact input::placeholder{color:#94A3B8}
.gact input:hover{border-color:var(--line2)}
.gact input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.gact .ttype{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;gap:6px;background:none;padding:0}
.gact .btn.primary{grid-column:auto;min-width:88px;padding:0 18px;white-space:nowrap}
.unit-holder{position:relative}
.unit-holder input{padding-right:38px}
.unit-holder .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none;font-weight:600}
.reclist{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px}
.reclist.lite{margin-top:19px;border-top:none;padding-top:0}
.reclist.lite .rl-head{margin-bottom:0}
.rl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.rl-title{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.rl-more{background:none;border:none;padding:0;font-family:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s}
.rl-more:hover{color:var(--brand)}
.rec{display:flex;align-items:center;gap:8px;font-size:15px;padding:5px 0}
.rec .rc-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.rec .amt{font-weight:700;color:var(--brand-ink);font-variant-numeric:tabular-nums;flex:none}
.rec .tag{font-size:14px;background:#E8EEF8;color:#1E40AF;border-radius:5px;padding:2px 7px;font-weight:700}
.rec .time{margin-left:2px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.obstacle{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink2);line-height:1.7}
.obstacle b{color:var(--ink);font-weight:700}
.auto-hint{margin-top:10px;font-size:15px;color:var(--brand-ink);background:#F1F6FF;border-radius:8px;padding:7px 11px;font-weight:600}
.auto-hint.lite{font-size:15px;font-weight:500;color:var(--muted);background:#F7F9FC;padding:6px 10px;margin-top:8px}
.auto-sub{margin-top:16px;font-size:15px;color:var(--muted);font-weight:500}
.examline{margin:0 0 16px;font-size:14px;font-weight:600;color:var(--ink2);background:#fff;border:none;border-radius:12px;padding:13px 18px;box-shadow:var(--shadow-sm)}
.review-today{display:flex;gap:14px;align-items:center;padding:21px 20px;margin-bottom:10px;border:1px solid #EDCB8E;border-radius:var(--r-lg);background:#FFF8E8}
.review-today.clk{cursor:pointer;transition:background .14s}
.review-today.clk:hover{background:#FEF1D5;border-color:#E4BC70}
.rv-body{flex:1;min-width:0}
.rv-title{font-size:22px;font-weight:700;color:#7C4A03;line-height:1.25}
.rv-title b{font-size:24px;font-weight:700;margin:0 2px;color:#B45309;line-height:1}
.rv-overdue{color:#B91C1C;font-weight:700;font-size:16px;margin-left:18px}
.rv-sub{font-size:15px;color:#92671A;margin-top:8px}
.rv-arrow{flex:none;font-size:14px;color:#A16207;font-weight:700;white-space:nowrap}
.rv-list{margin:8px 0 14px;border:none;background:#fff;border-radius:0 0 12px 12px;padding:4px 18px 8px;box-shadow:var(--shadow-sm)}
/* 今日页：左栏卡片、右列复盘。不再各自滚动——整页只有一条滚动条，从头通到底，
   右列 sticky 跟着页面走，滚到下面也还能复盘 */
.today-split{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px;align-items:start}
.rv-col{min-width:0;display:flex;flex-direction:column;grid-column:2;grid-row:1;position:sticky;top:18px}
.goal-col{min-width:0;display:flex;flex-direction:column;grid-column:1;grid-row:1}
.goal-col > :last-child,.rv-col > :last-child{margin-bottom:0}
/* 复盘内容比一屏还高时就不跟随了，否则底部永远看不到 */
.today-split.rv-static .rv-col{position:static;top:auto}
/* 页面主滚动条：细一点、圆角，和卡片里那条一个颜色 */
html{scrollbar-width:thin;scrollbar-color:#CBD5E3 transparent}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:#CBD5E3;border-radius:8px;border:2px solid var(--bg)}
html::-webkit-scrollbar-thumb:hover{background:#B4C2D6}
/* 只有宽屏才用窄栏特化，窄屏走原来的通栏排版 */
@media(min-width:1181px){
  .rv-col .rv-item{flex-direction:column;align-items:stretch;gap:10px}
  .rv-col .review-today{align-items:flex-start;padding:18px 16px}
  .rv-col .rv-overdue{display:block;margin-left:0;margin-top:11px}
  .rv-col .rv-arrow{margin-top:4px}
  .rv-col .rv-sub{line-height:1.7}
  .rv-col .rv-legend{display:none}
  .rv-col .rv-note{font-size:14px;line-height:1.6}
  .rv-col .rv-gh span{font-size:13px}
  .rv-col .rv-q{justify-content:space-between}
  .rv-col .rv-q button{flex:1;padding:0 4px;font-size:15px}
  .rv-col .rv-list{padding:6px 16px 10px;margin-top:10px;border-radius:12px}
  .rv-col .rv-item .rv-it-t em{font-size:13px}
  .rv-col .rv-item .rv-it-m{font-size:14px;gap:9px}
}
.rv-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rv-item:first-child{border-top:none}
.rv-it-main{flex:1;min-width:0}
.rv-it-t{font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rv-it-t em{font-style:normal;font-size:14px;font-weight:400;color:var(--muted)}
.rv-it-m{font-size:15px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.rv-it-m b{color:var(--ink2);font-weight:600}
.rv-it-m .late{color:#B44A4A;font-weight:600}
.rv-q{display:flex;gap:6px;flex:none}
.rv-q button{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .14s}
.rv-q button:hover{border-color:var(--brand);color:var(--brand);background:#F5F9FF}
.rv-q button.q1:hover{border-color:#D95757;color:#B44A4A;background:#FDF3F3}
.rv-q button.q2:hover{border-color:#D99A3E;color:#9A6B1C;background:#FDF8EF}
.rv-q button span{font-size:15px;font-weight:600;margin-left:4px}
.rv-q button.wide{min-width:62px;padding:0 12px}
.rv-q button.wide.q4:hover{border-color:#3F9C6B;color:#2E7D52;background:#F1F9F4}
.rv-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:15px;color:var(--muted);padding:12px 0 6px;line-height:1.7}
.rv-lg{display:inline-flex;align-items:baseline;gap:3px}
.rv-lg b{color:var(--ink2);font-weight:700}
.rv-lg-k{color:var(--ink2);font-weight:600}
.rv-note{font-size:15px;color:var(--muted);padding:8px 0 4px;line-height:1.65}
.addcard{width:100%;margin-top:16px;padding:18px;border:1px dashed var(--line2);border-radius:14px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.addcard:hover{background:#F7F9FC;border-color:#C9D4E4;color:var(--brand)}
.tmpls{display:flex;flex-wrap:wrap;gap:8px}
.tmpl{font-size:15px;font-weight:600;color:var(--ink2);background:#EEF2F7;border:1px solid var(--line-soft);border-radius:6px;padding:6px 10px;cursor:pointer;transition:all .15s}
.tmpl:hover{background:#EDF3FE;color:var(--brand)}
.ttype{display:flex;gap:8px;margin-top:10px}
.gact .ttype{display:flex;flex-wrap:wrap}
.tt{position:relative;font-size:15px;font-weight:600;color:var(--muted);background:#F1F5F9;border:none;border-radius:8px;height:40px;padding:0 18px;cursor:pointer;text-align:center;white-space:nowrap;transition:color .15s,background .15s}
.tt:hover{color:var(--ink2);background:#E8EEF7}
.tt.on{color:#fff;font-weight:700;background:var(--brand)}
.gact .btn.primary{margin-left:auto}
.ttag{background:#E8EEF8;color:#1E40AF}
.obs-path{margin-top:8px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;box-sizing:border-box}

/* 概览数字 */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.ov{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-sm)}
.ov-v{font-size:27px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.6px;line-height:1.25}
.ov-k{font-size:15px;color:var(--muted);font-weight:500}
.ov.c-blue .ov-v{color:#2563EB}
.ov.c-amber .ov-v{color:#D97706}
.ov.c-red .ov-v{color:#DC2626}
.ov.c-green .ov-v{color:#15803D}
.ov.c-mute .ov-v{color:#94A3B8}
.ov.c-violet .ov-v{color:#6D5BD0}
.ov.alert{border-color:#F0C4C0;background:#FFF7F6}

/* 最近 7 天节奏 */
.rhythm{margin-top:0}
.rh-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:19px;font-weight:700;letter-spacing:-.2px}
.rh-head span{color:var(--muted);font-size:14px;font-weight:500}
.rh-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rh-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:8px;background:#F8FAFC;border:1px solid var(--line-soft)}
.rh-cell .rh-d{font-size:14px;color:var(--muted)}
.rh-cell .rh-c{font-size:19px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rh-cell.on{background:#F2F7FF}
.rh-cell.on .rh-c{color:var(--ink)}
.rh-cell.today{border-color:var(--brand);background:#fff}
.rh-cell.miss{background:#FDF4F4}
.rh-cell.miss .rh-c,.rh-cell.miss .rh-d{color:#B44A4A}
.rh-cell.leave{background:#FDF8EF}
.rh-cell.leave .rh-c{color:#9A6B1C}
.rh-cell.clk{cursor:pointer}
.rh-cell.clk:hover{background:#F1F4F9}
.rh-tip{margin-top:12px;font-size:15px;color:var(--muted)}
.fdrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fdrow:first-of-type{border-top:none}
.fdname{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.fdname span{font-size:14px;font-weight:400;color:var(--muted)}
.fdrow input{width:76px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;text-align:center;flex:none}
.fdrow select{width:76px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;background:#fff;flex:none}
.fdleave{padding:10px 12px;background:#FDF8EF;border:none;border-radius:9px;font-size:14px;color:#8A6118;margin-bottom:10px}

/* 热力图 */

/* 窄屏：复盘回到通栏，卡片整宽 */

  .rv-col{position:static;top:auto}
}
.heat-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:2px}
.heat-dow span{text-align:center;font-size:15px;color:var(--muted);font-weight:500}
.heat-cell{aspect-ratio:1;width:auto;height:auto;border-radius:6px;background:#E8EDF5}

.heat-cell.l2{background:#7BA9F0}
.heat-cell.l3{background:#2F6BE4}

.heat-sum{text-align:center;font-size:15px;color:var(--muted);margin-top:14px}
.heat-sum b{color:var(--ink2);font-weight:700;margin:0 1px}
.heat-legend .heat-cell{width:13px;height:13px;aspect-ratio:auto;border-radius:3px}

/* 动态 */
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.feed-row:last-child{border-bottom:none}
.feed-n{font-weight:600;min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-a{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-d{color:var(--muted);font-size:14px;white-space:nowrap}
.feed-act{flex:none;border:1px solid transparent;background:none;font-family:inherit;font-size:14px;font-weight:600;color:#9AA6B6;cursor:pointer;padding:3px 7px;border-radius:6px;line-height:1.2;transition:color .14s,background .14s}
.feed-act:hover{color:var(--brand);background:#EDF3FE}
.rec-fixed{display:flex;align-items:center;min-height:42px;padding:0 11px;border:1px solid var(--line-soft);border-radius:8px;background:#F8FAFC;font-size:15px;color:var(--ink2);font-weight:600}
@media(max-width:640px){.feed-act{font-size:13px;padding:2px 4px}.feed-n{max-width:38%}}
.rlab{display:block;font-size:15px;font-weight:600;color:var(--ink2);margin:14px 0 6px;letter-spacing:.1px}
.tdist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.td-cell{background:#F8FAFC;border:1px solid var(--line-soft);border-radius:8px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.td-name{font-size:15px;color:var(--muted);font-weight:600}
.td-n{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.td-m{font-size:15px;color:var(--muted)}

/* 看板 */
.hsub{font-size:15px;font-weight:400;color:var(--muted);margin-left:10px}
@media(max-width:640px){
  .card h3{flex-wrap:wrap;align-items:flex-start}
  .hsub{flex:0 0 100%;margin-left:0;margin-top:2px;font-size:14px}
}
.tm-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#E2E8F0;margin:4px 0 18px}
.tm-bar i{display:block;height:100%}
.tm-grid{display:grid;grid-template-columns:1fr;gap:12px}
.tm-row{display:flex;align-items:center;gap:10px;font-size:15px}
.tm-dot{width:8px;height:8px;border-radius:2px;flex:none}
.tm-name{font-weight:600;color:var(--ink);width:52px;flex:none;font-size:15px}

.tm-track i{display:block;height:100%;border-radius:99px}
.tm-n{font-variant-numeric:tabular-nums;color:var(--ink);flex:none;min-width:48px;text-align:right;font-size:15px;font-weight:600}
.tm-p{color:var(--muted);font-size:14px;flex:none;min-width:40px;text-align:right}
.tm-sum{font-size:15px;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

/* 手机端四类投入：一行放下，不挤到边缘 */

}

/* 请假 */
.leave-card{display:flex;flex-direction:column}
.leave-card .leave-form{margin:auto 0;grid-template-columns:1fr;gap:13px}
.leave-card .leave-form .btn{width:100%}
.leave-form{display:grid;grid-template-columns:190px 1fr auto;gap:12px;align-items:end}
.leave-form .mfield{margin-bottom:0}
.leave-form .btn{min-width:104px}
@media(max-width:640px){
  .leave-form{grid-template-columns:1fr;gap:10px}
  .leave-form .btn{width:100%}
}
.lh-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;scrollbar-width:thin;-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.lh-row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.lh-row:last-child{border-bottom:none}
.lh-dot{width:6px;height:6px;border-radius:50%;flex:none;background:#C0504D}
.lh-row.leave .lh-dot{background:var(--amber)}
.lh-row.leavedone .lh-dot{background:#C9D2DE}
.lh-d{font-weight:600;color:var(--ink);flex:none;min-width:84px;font-variant-numeric:tabular-nums}
.lh-tag{flex:none;font-size:14px;font-weight:600;padding:2px 7px;border-radius:5px;background:#FDF0F0;color:#B44A4A;white-space:nowrap}
.lh-row.leave .lh-tag{background:#FBF3E4;color:#94661A}
.lh-row.leavedone .lh-tag{background:#F2F4F8;color:#7A8497}
.lh-note{flex:1;min-width:0;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh-btn{flex:none;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:2px 4px;white-space:nowrap}
.lh-btn:hover{color:var(--brand)}
.lh-btn.del:hover{color:#B44A4A}
.lh-foot{font-size:15px;color:var(--muted);margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.lh-foot b{color:var(--ink2);font-weight:700;margin:0 1px}
.lh-empty{font-size:14px;color:var(--muted);padding:8px 0}

/* 知识点闭环 */
.cl-legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-bottom:10px}
.cl-legend span{display:flex;align-items:center;gap:5px}
.cl-legend em{font-style:normal;color:#A8B1BF;margin-left:2px}
.cl-list{display:flex;flex-direction:column}
.cl-row{display:block;border-bottom:1px solid var(--line);padding:0}
.cl-row summary{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:10px;align-items:center;padding:13px 0;cursor:pointer;list-style:none;font-size:15px}
.cl-row summary::-webkit-details-marker{display:none}
.cl-row[open] summary{border-bottom:1px solid var(--line)}
.cl-items{padding:6px 0 8px 44px}
.cl-item{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.cl-item:last-child{border-bottom:none}
.ci-head{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ci-head i{font-style:normal;font-size:14px;padding:2px 7px;border-radius:5px;font-weight:600}
.ci-point{font-size:15px;color:var(--muted);margin:3px 0}
.ci-chain{display:flex;gap:14px;font-size:15px;color:var(--ink2);flex-wrap:wrap}
.ci-next{color:var(--brand);font-weight:600}
.cl-no{font-weight:600;color:#A8B1BF;font-size:14px;font-variant-numeric:tabular-nums}
.cl-name{font-weight:600;font-size:15px;letter-spacing:-.1px}
.cl-count{color:var(--muted);font-size:15px}
.cl-lv{display:flex;gap:4px}
.cl-lv i{font-style:normal;font-size:14px;padding:3px 9px;border-radius:6px;font-weight:700;white-space:nowrap;color:#fff}
.cl-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;font-style:normal}
.lv-a{background:#1E9E67;color:#fff}
.lv-b{background:#D9932E;color:#fff}
.lv-c{background:#D4554F;color:#fff}
.cl-due{color:#C0504D;font-weight:600;font-size:15px}
.cl-week{color:#9A6B1C;font-size:15px}
.cl-ok{color:var(--muted);font-size:15px}
.rlab ~ textarea, .card textarea.weekout{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px;font-size:15px;line-height:1.7;font-family:inherit;resize:vertical;background:#FBFCFE}
.wn-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wline{font-size:14px}
.wline.dim{font-size:14px;color:var(--muted)}
@media (max-width:640px){
  .review-today{gap:10px;padding:19px 16px;align-items:flex-start}
  .rv-title{font-size:19px}
  .rv-title b{font-size:21px;margin:0 2px}
  .rv-cap{display:none}
  .rv-overdue{display:block;margin-left:0;margin-top:3px;font-size:14px}
  .rv-arrow{flex:none}
  .ov-grid{grid-template-columns:repeat(2,1fr)}
  .ov{padding:13px 10px}
  .ov-v{font-size:23px}
  .feed-n{min-width:0}
  .heat-row,.heat-dow{gap:6px}
  .heat-cell{border-radius:5px}
  .tdist{grid-template-columns:repeat(2,1fr)}
  .card h3,.chart-card h3{font-size:19px;margin-bottom:10px}
  .gname{font-size:19px;max-width:38%}
  .ghead{gap:8px}
  .ghead .gname{flex:1 1 100%;max-width:100%;margin-right:0}
  .ghead .chip{order:5}
  .ghead .blink{order:3;font-size:14px}
  .ghead .gs{order:4;font-size:14px}
  .ghead .gs b{font-size:16px}
  .ghead .gs b.et-none{font-size:15px}
  .reclist.lite{margin-top:15px}
  .gact{grid-template-columns:1fr 88px;gap:10px}
  .gact .f-amt{grid-column:1;grid-row:1}
  .gact .f-min{grid-column:2;grid-row:1}
  .gact .f-content{grid-column:1/-1;grid-row:2}
  .gact .ttype{grid-row:3;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .gact .ttype .btn.primary{grid-column:1/-1;margin-left:0;margin-top:8px}
  .gact .tt{padding:0 6px;height:38px;font-size:14px}
  .rh-grid{gap:4px}
  .rh-cell{padding:8px 0;gap:4px;border-radius:9px}
  .rh-cell .rh-c{font-size:14px;white-space:nowrap}
  .rh-cell .rh-d{font-size:14px;white-space:nowrap}
  .cl-legend em{display:none}
  .rv-item{flex-direction:column;align-items:stretch;gap:10px;padding:13px 0}
  .rv-q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rv-q button{width:100%;min-width:0;height:40px;justify-content:center;font-size:14px}
  .rv-q button span{font-size:14px}
  .rv-q button.wide{min-width:0;width:100%;grid-column:span 2}
  .cl-row{grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;row-gap:6px;align-items:center}
  .cl-name{grid-row:1;grid-column:2}
  .cl-count{grid-row:1;grid-column:3;justify-self:end}
  .cl-lv{grid-row:2;grid-column:2}
  .cl-due,.cl-week,.cl-ok{grid-row:2;grid-column:3;justify-self:end}
  .card{padding:14px 13px;border-radius:10px;margin-bottom:10px}
}

.gadd{margin-top:16px}
.gbtn{white-space:nowrap;background:#fff!important;border:1px solid var(--line2)!important;color:var(--ink2)!important;font-size:15px!important;font-weight:600!important;min-height:42px!important;padding:0 14px!important;border-radius:10px!important}
.gbtn:hover{background:#F5F8FC!important;color:var(--brand)!important;border-color:#CFD8E5!important}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;background:var(--brand);color:#fff;transition:background .15s,box-shadow .15s;box-shadow:none;border:1px solid transparent;letter-spacing:.1px}
.btn:hover{background:var(--brand2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--grad);color:#fff}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
.btn.ghost:hover{background:#F7F9FC;color:var(--ink);border-color:#CFD8E5}
.btn.plain{background:transparent;color:var(--muted);border:none;min-height:30px;padding:3px 6px;font-weight:600;font-size:15px}
.btn.plain:hover{background:#F4F6FA;color:var(--brand)}
.btn.danger{background:#fff;color:#B44A4A;border:1px solid #F0DCDC}
.btn.danger:hover{background:#FDF4F4;color:#9E3B3B}
.btn.sm{min-height:34px;height:34px;padding:0 13px;font-size:15px;border-radius:8px;box-sizing:border-box}
.btn.block{width:auto;min-width:170px;padding:0 28px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* ===== 看板 ===== */
/* 各科目进度：环形图 */
.bring-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:6px 4px;margin-top:4px}
.bring{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px 12px;min-width:0}
.rng{position:relative;width:96px;height:96px;flex:none}
.rng svg{width:96px;height:96px;display:block}
.rng-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.bring .rname{font-size:15px;font-weight:700;line-height:1.35;color:var(--ink);margin-top:10px;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:22px;letter-spacing:-.1px}
.bring .rmeta{font-size:14px;color:var(--muted);margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bring .robs{font-size:14px;color:#B45309;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){
  .bring-grid{grid-template-columns:repeat(2,1fr);gap:2px}
  .bring{padding:8px 4px 10px}
  .rng,.rng svg{width:84px;height:84px}
  .rng-v{font-size:17px}
  .bring .rname{font-size:14px;min-height:20px}
  .bring .rmeta,.bring .robs{font-size:13px}
}
.chart-card h3{font-size:22px;margin-bottom:14px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:500}
.legend i{width:9px;height:9px;border-radius:2px;flex:none}


/* 14 天柱状图（HTML 绘制，字号不随宽度缩放） */
.c14{display:grid;grid-template-columns:46px 1fr;column-gap:12px;margin-top:26px}
.c14-y{position:relative;height:280px}
.c14-y span{position:absolute;right:0;transform:translateY(50%);font-size:14px;color:#7A8699;font-variant-numeric:tabular-nums;line-height:1}
.c14-plot{position:relative;height:280px;border-bottom:1px solid #D8E0EC}
.c14-line{position:absolute;left:0;right:0;border-top:1px solid #EFF3F9}
.c14-cols{position:absolute;inset:0;display:flex;align-items:flex-end}
.c14-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-width:0}
.c14-col::before{content:"";position:absolute;left:18%;right:18%;top:0;bottom:0;background:#F8FAFD;border-radius:5px}
.c14-bar{position:relative;width:64%;height:100%;display:flex;flex-direction:column-reverse;z-index:1}
.c14-bar i{display:block;width:100%;flex:0 0 auto;min-height:2px}
.c14-bar i:first-child{border-radius:0 0 5px 5px}
.c14-bar i:last-child{border-radius:5px 5px 0 0}
.c14-bar i:only-child{border-radius:5px}
.c14-x{grid-column:2;display:flex;margin-top:9px}
.c14-x span{flex:1;min-width:0;text-align:center;font-size:14px;color:#7A8699;font-variant-numeric:tabular-nums;white-space:nowrap}
.c14-x span.on{color:#1D4ED8;font-weight:700}
@media(max-width:1200px){.c14-x span{font-size:13px}}
.c14-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#94A3B8;pointer-events:none}
.c14-m .c14-y,.c14-m .c14-plot{height:240px}
.c14-m .c14-y span{font-size:14px}
.c14-m .c14-x span{font-size:12px}
.c14-m{grid-template-columns:38px 1fr;column-gap:8px}
.c14-m .c14-bar{width:58%}

/* ===== 周报 ===== */
.weekhead{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.4px}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .gdot{width:8px;height:8px;border-radius:2px;flex:none}
.wrow .wn{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wv{font-size:15px;color:var(--muted);white-space:nowrap}
.wrow .wv b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:600;white-space:nowrap;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:#2E7D52}
.delta.down{color:#B44A4A}
.delta.flat{color:var(--muted)}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.week-compare{display:flex;gap:16px;align-items:center;padding:12px 16px;background:#F8FAFC;border:1px solid var(--line-soft);border-radius:8px;font-size:15px;color:var(--ink2);margin:14px 0 0}
.week-compare b{color:var(--ink);font-weight:700}
.week-compare .dim{color:var(--muted)}
.week-compare .delta{margin-left:auto}
.fcell{background:#F8FAFC;border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px}
.fcell .k{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.fcell .v{font-size:26px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.5px}
.fcell .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.fcell .v.small{font-size:14px;line-height:1.55;font-weight:600;letter-spacing:0}
.weekout{width:100%;min-height:132px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;resize:vertical;font-size:15px;line-height:1.75;font-family:inherit}

/* ===== 我的 ===== */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:none}
.setrow .sk{font-size:15px;font-weight:600}
.setrow .sd{font-size:15px;color:var(--muted);margin-top:2px}
.setrow select{border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;min-height:38px;font-weight:500;font-size:15px}
.glist .gitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.glist .gitem:last-child{border-bottom:none}
.glist .gitem .btn{flex:none;white-space:nowrap}
.gitem .gdot{width:9px;height:9px;border-radius:3px;flex:none}
.gitem .ginfo{flex:1;min-width:0}
.gitem .ginfo .gn{font-size:16px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

<script>
/* ================= 数据 ================= */
var LS = "study-tracker-v1";
var REC_TYPES = [["study", "学习"], ["review", "复习"], ["practice", "练习"], ["recite", "背诵"]];
/* 台账目录：每个科目一个根目录，扫描里面所有含「#### 台账数据」的 md */
var DEFAULT_ROOTS = [
  { key: "math", name: "数学", path: "考研/数学/零基础通关讲义", mode: "four" },
  { key: "cs",   name: "408",  path: "考研/408", mode: "two" },
  { key: "pol",  name: "政治", path: "考研/政治", mode: "two" }
];
var MODE_LABEL = { four: "①②③④", two: "记得 / 没记住" };
function typeName(t){
  for (var i = 0; i < REC_TYPES.length; i++) if (REC_TYPES[i][0] === t) return REC_TYPES[i][1];
  return "学习";
}
var state = load();

function defaultState(){
  return {
    version: 1,
    goals: [
      {id:"g1", name:"考研数学 · 讲义", unit:"讲", total:20, deadline:"2027-12-20", color:"#2563EB", base:0, obsidian:"math-notes", obstacle:"", countermeasure:""},
      {id:"g2", name:"考研英语 · 每日一句", unit:"句", total:100, deadline:"2027-12-20", color:"#4A90D9", base:0, obsidian:"sentence", obstacle:"", countermeasure:""},
      {id:"g3", name:"考研英语 · 单词", unit:"词", total:6024, deadline:"2027-12-20", color:"#E8A33D", base:581, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g4", name:"408 · 数据结构", unit:"轮", total:3, deadline:"2027-09-30", color:"#E25B5B", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g5", name:"408 · 计算机组成原理", unit:"轮", total:3, deadline:"2027-09-30", color:"#7FB069", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g6", name:"408 · 操作系统", unit:"轮", total:3, deadline:"2027-09-30", color:"#E882B0", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g7", name:"408 · 计算机网络", unit:"轮", total:3, deadline:"2027-09-30", color:"#C77D5A", base:0, obsidian:"", obstacle:"", countermeasure:""}
    ],
    records: [],
    kbRoots: JSON.parse(JSON.stringify(DEFAULT_ROOTS)),
    rvLog: [],
    /**
     * 错题统计（待接入，先占位不改数据结构）
     * ------------------------------------------------------------
     * 计划挂在这里：state.mistakes = [{
     *   id, goalId,           // 归属科目
     *   subj, title, file,    // 学科 / 知识点 / 来源 md
     *   q,                    // 本次复盘评级 0~3（四档）或 0~1（两档）
     *   lv,                   // 折算后的掌握度 A/B/C，与复盘三档一致
     *   date, ts,             // 出错日期
     *   note                  // 错因（可选，手动补）
     * }]
     * 接入点：rvRate() 写 rvLog 的同一处 —— 一次评级同时喂给 SM-2 和错题本，不重复录入。
     * 届时 normalize() 需补 mistakes 的字段过滤，并保持「字段只增不减」以兼容旧数据。
     */
    obsidianCounts: {},
    obsidianInfo: { dir: "", ts: 0, supported: false },
    settings: {
      leaveDays: [],
      sentenceBank: [
        "道阻且长，行则将至；行而不辍，未来可期。",
        "种一棵树最好的时间是十年前，其次是现在。",
        "流水不争先，争的是滔滔不绝。",
        "知不足而奋进，望远山而前行。",
        "博观而约取，厚积而薄发。",
        "日拱一卒，功不唐捐。",
        "慢慢来，比较快。",
        "所有的为时已晚，其实都是恰逢其时。"
      ],
      dailySentence: ""
    },
    dismissed: {},
    lastBackup: 0
  };
}
function normalize(s){
  var d = defaultState();
  s.settings = Object.assign({}, d.settings, s.settings || {});
  s.settings.leaveDays = (Array.isArray(s.settings.leaveDays) ? s.settings.leaveDays : [])
    .map(function(l){ return { date: normDate(l && l.date), note: String((l && l.note) || "") }; })
    .filter(function(l){ return l.date; });
  s.dismissed = s.dismissed && typeof s.dismissed === "object" ? s.dismissed : {};
  s.goals = (Array.isArray(s.goals) ? s.goals : []).filter(function(g){ return g && g.id && g.name && g.total != null && g.deadline; })
    .map(function(g){
      return { id: String(g.id), name: String(g.name), unit: String(g.unit || "次"), total: +g.total || 0,
        deadline: String(g.deadline), color: g.color || d.goals[0].color,
        base: +g.base || 0, archived: !!g.archived,
        obsidian: (g.obsidian === "math-notes" || g.obsidian === "sentence" || /^dir:/.test(g.obsidian) || /^tbl:/.test(g.obsidian)) ? g.obsidian : "",
        obstacle: String(g.obstacle || ""), countermeasure: String(g.countermeasure || "") };
    });
  s.records = (Array.isArray(s.records) ? s.records : []).filter(function(r){
    return r && r.goalId && r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && (+r.amount) > 0;
  }).map(function(r){
    var t = String(r.type || "");
    var okT = REC_TYPES.some(function(x){ return x[0] === t; });
    return { id: String(r.id || uid()), goalId: String(r.goalId), date: String(r.date), amount: +r.amount,
      minutes: +r.minutes || 0, backfill: !!r.backfill, type: okT ? t : "study", noType: !okT,
      content: String(r.content || "").slice(0, 60), ts: r.ts || 0 };
  });
  s.kbRoots = (Array.isArray(s.kbRoots) && s.kbRoots.length ? s.kbRoots : JSON.parse(JSON.stringify(DEFAULT_ROOTS)))
    .filter(function(r){ return r && r.path; })
    .map(function(r){
      return { key: String(r.key || uid()), name: String(r.name || "科目"),
        path: String(r.path).replace(/^\/+|\/+$/g, ""), mode: r.mode === "two" ? "two" : "four" };
    });
  s.rvLog = (Array.isArray(s.rvLog) ? s.rvLog : []).filter(function(x){ return x && x.date; }).slice(-800);
  s.obsidianCounts = s.obsidianCounts && typeof s.obsidianCounts === "object" ? s.obsidianCounts : {};
  s.obsidianInfo = s.obsidianInfo && typeof s.obsidianInfo === "object"
    ? Object.assign({ dir: "", ts: 0, supported: false, examDate: "", mathChapters: [], sentenceLast: "", reviewToday: 0, reviewOverdue: 0 }, s.obsidianInfo)
    : { dir: "", ts: 0, supported: false, examDate: "", mathChapters: [], sentenceLast: "", reviewToday: 0, reviewOverdue: 0 };
  s.lastBackup = +s.lastBackup || 0;
  s.reviews = s.reviews && typeof s.reviews === "object" ? s.reviews : {};
  if (!s.goals.length) s.goals = d.goals;
  return s;
}
function load(){
  try {
    var raw = localStorage.getItem(LS);
    if (raw) { var s = JSON.parse(raw); if (s && Array.isArray(s.goals)) return normalize(s); }
  } catch (e) {}
  return normalize(defaultState());
}
function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

/* ================= Obsidian 自动同步（桌面 Edge/Chrome） ================= */
function obsSupported(){ return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function"; }
function idbOpen(){
  return new Promise(function(res, rej){
    var r = indexedDB.open("study-obsidian", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction("kv", "readonly").objectStore("kv").get(key);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function idbSet(key, val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(val, key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbDel(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function descend(root, parts){
  if (!parts.length) return Promise.resolve(root);
  var head = parts[0], rest = parts.slice(1);
  if (/\.md$/.test(head)){
    return root.getFileHandle(head);
  }
  return root.getDirectoryHandle(head).then(function(h){ return descend(h, rest); });
}
var SKIP_DIRS = /^(images?|img|图片|assets|代码|code|\.obsidian|\.trash|附件)$/i;
var CHAP_NAMES = { "01": "基本逻辑", "02": "解析式", "03": "方程与不等式", "04": "函数", "05": "数列", "06": "坐标系" };
function walkMd(dirHandle, base, out, depth){
  if (depth > 3) return Promise.resolve();
  return Promise.resolve().then(async function(){
    for await (const e of dirHandle.values()){
      if (e.kind === "directory"){
        if (SKIP_DIRS.test(e.name)) continue;
        await walkMd(e, base + "/" + e.name, out, depth + 1);
      } else if (/\.md$/.test(e.name)){
        out.push({ dir: base, file: e.name, handle: e });
      }
    }
  });
}
function parseLedger(txt){
  var items = [];
  if (txt.indexOf("#### 台账数据") < 0) return items;
  // 先剥掉代码块，避免把 dataviewjs 脚本里的 title:: 当成条目
  var zone = txt.split("#### 台账数据").pop().replace(/```[\s\S]*?```/g, "");
  var blocks = zone.split(/\n\s*\n/);
  blocks.forEach(function(b){
    // 一条记录的第一行必须是 title::，别的字段打头的一律不算
    if (!/^[ \t]*title::/m.test(b.replace(/^\s*\n/, ""))) return;
    function field(name){
      var m = new RegExp(name + "::\\s*(.+)").exec(b);
      return m ? m[1].trim() : "";
    }
    var iv = parseFloat(field("interval"));
    if (!(iv >= 1)) iv = ({ C: 2, B: 4, A: 15 })[String(field("level")).toUpperCase()] || 2;
    var last = field("last_review") || field("study_date");
    items.push({
      title: field("title"), point: field("point"), study: field("study_date"),
      times: parseInt(field("times")) || 0, last: last,
      next: last ? toKey(addDays(fromKey(last), iv)) : "",

function scanRoot(dirHandle, cfg){

    var groups = {};
    for (var i = 0; i < files.length; i++){
      var f = files[i];

      var items = parseLedger(txt);
      if (!items.length) continue;
      var gno, gname;
      if (cfg.mode === "four" && /^\d{2}-/.test(f.file)){
        gno = f.file.slice(0, 2);
        gname = CHAP_NAMES[gno] || f.file.replace(/^\d{2}-/, "").replace(/-\d{4}-\d{1,2}-\d{1,2}\.md$/, "");
      } else {
        var sub = f.dir.slice(cfg.path.length).replace(/^\//, "");
        gno = sub || cfg.name;
        gname = f.file.replace(/\.md$/, "").replace(/-\d{4}-\d{1,2}-\d{1,2}$/, "");
      }
      var gk = gno + "|" + gname;
      if (!groups[gk] || cfg.mode === "four"){
        groups[gk] = groups[gk] || { no: gno, name: gname, total: 0, A: 0, B: 0, C: 0, dueToday: 0, dueWeek: 0, items: [] };
      }
      var g = groups[gk];
      items.forEach(function(it){
        it.file = f.file; it.dir = f.dir; it.group = g.name;
        g.total++; g[it.lv]++;
        if (it.next && it.next <= tk) g.dueToday++;
        else if (it.next && it.next <= weekEnd) g.dueWeek++;
        g.items.push(it);
      });
    }
    var sub2 = { key: cfg.key, name: cfg.name, mode: cfg.mode, dir: cfg.path,
      groups: Object.keys(groups).map(function(k){ return groups[k]; }),
      total: 0, A: 0, B: 0, C: 0, dueToday: 0, dueWeek: 0 };
    sub2.groups.sort(function(a, b){
      return String(a.no).localeCompare(String(b.no), "zh", { numeric: true }) || String(a.name).localeCompare(String(b.name), "zh", { numeric: true });
    });
    sub2.groups.forEach(function(g){
      sub2.total += g.total; sub2.A += g.A; sub2.B += g.B; sub2.C += g.C;
      sub2.dueToday += g.dueToday; sub2.dueWeek += g.dueWeek;
      g.items.sort(function(a, b){ return String(a.title).localeCompare(String(b.title), "zh", { numeric: true }); });
    });

  });
}

function readObsidian(root){

    } else if (o.indexOf("tbl:") === 0){

    .then(function(h){ return h.getFile(); })
    .then(function(f){ return f.text(); })
    .then(function(txt){
      var today = todayKey();

      txt.split("\n").forEach(function(line){
        var m = /^- \[ \] 复盘 .+?\(@(\d{4}-\d{1,2}-\d{1,2})/.exec(line);

  jobs.push(Promise.all(state.kbRoots.map(function(cfg){

      .catch(function(e){

          total: 0, A: 0, B: 0, C: 0, dueToday: 0, dueWeek: 0, missing: true };
      });
  })).then(function(list){

    var due = 0, over = 0, tk = todayKey();
    list.forEach(function(sub){
      (sub.groups || []).forEach(function(g){
        (g.items || []).forEach(function(it){

          if (it.next < tk) over++;

/* ================= 日期工具 ================= */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function toKey(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fromKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayKey(){ return toKey(new Date()); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function weekdayCN(d){ var jd = d.getDay(); return jd === 0 ? 7 : jd; }
function fmtDate(k){ var p = k.split("-"); return (+p[1]) + "月" + (+p[2]) + "日"; }
function fmtShort(k){ var p = k.split("-"); return p[1] + "/" + p[2]; }
function fmtTime(ts){ if (!ts) return ""; var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ================= 统计（纯函数） ================= */
function getGoal(id){ for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i]; return null; }
function recsOn(gid, k){ return state.records.filter(function(r){ return r.goalId === gid && r.date === k; }); }
function amountOn(gid, k){ return recsOn(gid, k).reduce(function(s, r){ return s + r.amount; }, 0); }
function minutesOn(gid, k){ return recsOn(gid, k).reduce(function(s, r){ return s + (r.minutes || 0); }, 0); }
function autoCount(g){ if (!g.obsidian) return 0; return (state.obsidianCounts && state.obsidianCounts[g.obsidian]) || 0; }
function doneTotal(g){ return (+g.base || 0) + state.records.reduce(function(s, r){ return r.goalId === g.id && r.type === "study" ? s + r.amount : s; }, 0) + autoCount(g); }
function remaining(g){ return Math.max(0, (+g.total || 0) - doneTotal(g)); }
function daysLeft(g){ var t = fromKey(todayKey()), dl = fromKey(g.deadline); return Math.round((dl - t) / 86400000) + 1; }
function suggest(g){
  var rem = remaining(g), dl = daysLeft(g);
  if (rem <= 0) return { v: 0, note: "目标已完成" };
  if (dl <= 0) return { v: 0, note: "已到截止日" };
  if (g.name && g.name.indexOf("单词") >= 0) return { v: 50, note: "" };
  return { v: Math.ceil(rem / dl), note: "" };
}
function pace7(g){
  var t = fromKey(todayKey()), sum = 0, cnt = 0;
  for (var i = 0; i < 7; i++) { var a = amountOn(g.id, toKey(addDays(t, -i))); sum += a; if (a > 0) cnt++; }
  if (cnt < 3) return null;
  return sum / 7;
}
function eta(g){
  var p = pace7(g);
  if (p === null || p <= 0) return null;
  var rem = remaining(g);
  if (rem <= 0) return todayKey();
  return toKey(addDays(fromKey(todayKey()), Math.ceil(rem / p)));
}
function streak(g){
  var lv = leaveDates();
  var d = fromKey(todayKey()), n = 0, miss = 0;
  for (var i = 0; i < 400; i++){
    var k = toKey(d);
    if (amountOn(g.id, k) > 0) { n++; miss = 0; }
    else if (lv.indexOf(k) >= 0) { miss = 0; }
    else { miss++; if (miss >= 2) break; }
    d = addDays(d, -1);
  }
  return n;
}
function missInfo(g){
  if (g.obsidian && state.obsidianInfo && state.obsidianInfo.dir) return null;
  if (!state.records.some(function(r){ return r.goalId === g.id; })) return null;
  if (amountOn(g.id, todayKey()) > 0) return null;
  if (state.dismissed && state.dismissed[g.id] === todayKey()) return null;
  var y = addDays(fromKey(todayKey()), -1), yk = toKey(y);
  if (amountOn(g.id, yk) > 0) return null;
  var leaveDays = leaveDates();
  if (leaveDays.indexOf(yk) >= 0) return { type: "leave", days: 0 };
  var miss = 0, d = y;
  for (var i = 0; i < 60; i++){
    var k = toKey(d);
    if (amountOn(g.id, k) > 0) break;
    if (leaveDays.indexOf(k) < 0) miss++;
    d = addDays(d, -1);
  }
  if (miss <= 1) return { type: "grace", days: 1 };
  return { type: "overdue", days: miss - 1 };
}
function weekRange(off){
  var t = fromKey(todayKey()), wd = weekdayCN(t);

function escapeRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function findBlockRange(text, title){
  // 用最后一次出现的位置，避免文档里别的代码块也写了这个标题
  var zone = text.lastIndexOf("#### 台账数据");
  if (zone < 0) return null;
  var seg = text.slice(zone), parts = [], pos = 0;
  while (true){
    var m = seg.slice(pos).match(/\n[ \t]*\n/);
    if (!m){ parts.push([pos, seg.length]); break; }
    parts.push([pos, pos + m.index]);
    pos = pos + m.index + m[0].length;
  }
  var re = new RegExp("^[ \\t]*title::[ \\t]*" + escapeRe(title) + "[ \\t]*$", "m");
  for (var i = 0; i < parts.length; i++){
    var chunk = seg.slice(parts[i][0], parts[i][1]);
    if (re.test(chunk)) return { start: zone + parts[i][0], end: zone + parts[i][1], chunk: chunk };
  }
  return null;
}
function patchFields(chunk, fields){
  var out = chunk;
  Object.keys(fields).forEach(function(k){
    var re = new RegExp("(^[ \\t]*" + k + "::[ \\t]*).*$", "m");
    if (re.test(out)) out = out.replace(re, "$1" + fields[k]);
    else out = out.replace(/\s+$/, "") + "\n" + k + ":: " + fields[k];
  });
  return out;
}
/* 积压压力：不依赖考试日期，用「到期占比」和「逾期占比」判断最近是不是拖了 */
function backlogPressure(){
  var worst = 0, dueAll = 0, totalAll = 0;
  subjectLoop().forEach(function(s){
    var t = +s.total || 0, due = (+s.dueToday || 0) + (+s.dueWeek || 0);
    totalAll += t; dueAll += due;
    if (t >= 4) worst = Math.max(worst, due / t);
  });
  if (totalAll >= 4) worst = Math.max(worst, dueAll / totalAll);
  var q = reviewItems();
  if (q.length >= 4){
    var od = 0;
    q.forEach(function(x){ if (+x.late > 0) od++; });
    worst = Math.max(worst, od / q.length);
  }
  return Math.min(1, worst);
}
function capDays(){
  var n = examDays();
  var base = (n == null) ? 30 : Math.max(1, Math.min(30, Math.round(0.15 * n)));
  var p = backlogPressure();
  if (p >= 0.6) return Math.max(5, Math.round(base * 0.4));
  if (p >= 0.3) return Math.max(7, Math.round(base * 0.6));
  return base;
}
function nextSchedule(iv, ef, times, q, late, mode){
  ef = +ef || 2.5;
  ef = ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  ef = Math.max(1.3, Math.min(2.8, Math.round(ef * 100) / 100));
  var ni;
  if (q <= 2) ni = 1;
  else if (mode === "two"){
    // 政治 / 408：前三次固定 1 / 3 / 7 天，之后才乘 EF，避免一次「记得」把间隔拉太狠
    if (!times) ni = 1;
    else if (times === 1) ni = 3;
    else if (times === 2) ni = 7;
    else ni = Math.round((+iv || 7) * ef * (late > 0 ? 1 + Math.min(0.3, late * 0.02) : 1));
  }
  else if (!times) ni = 1;
  else if (times === 1) ni = 6;
  else {
    var bonus = 1;
    if (late > 0 && q >= 4) bonus = 1 + Math.min(0.3, late * 0.02);
    ni = Math.round((+iv || 1) * ef * bonus);
  }
  ni = Math.max(1, Math.min(capDays(), ni));
  return { iv: ni, ef: ef, times: times + 1 };
}

      if (p === "granted") return handle;

function rvRate(file, title, q, mode){

    { iv: 1, ef: 2.5, times: 0, late: 0, dir: "考研/数学/零基础通关讲义", subjName: "", mode: mode || "four" };
  var useMode = mode || it.mode || "four";

    return dir.getFileHandle(file);
  }).then(function(fh){
    return fh.getFile().then(function(f){ return f.text(); }).then(function(text){
      var r = findBlockRange(text, title);

        var chunk = patchFields(r.chunk, { last_review: todayKey(), interval: s.iv, ef: s.ef.toFixed(2), times: s.times });
        return fh.createWritable().then(function(w){

        /* 错题统计（待接入）：在此处追加 state.mistakes.push({...})，

function heat35(){
  var t = fromKey(todayKey());
  var thisMon = addDays(t, -(weekdayCN(t) - 1));
  var start = addDays(thisMon, -28);
  var weeks = [], maxMin = 0;
  for (var w = 0; w < 5; w++){
    var row = [];
    for (var d = 0; d < 7; d++){
      var k = toKey(addDays(start, w * 7 + d));
      var dayRecs = state.records.filter(function(r){ return r.date === k; });
      var mins = dayRecs.reduce(function(x, r){ return x + (+r.minutes || 0); }, 0);
      row.push({ k: k, mins: mins, n: dayRecs.length });
      if (mins > maxMin) maxMin = mins;
    }
    weeks.push(row);
  }
  function lvl(c){
    if (!c.n) return 0;
    if (!maxMin) return 2;
    var v = Math.ceil(c.mins / maxMin * 4);
    return Math.max(1, Math.min(4, v || 1));
  }
  var dowNames = ["一", "二", "三", "四", "五", "六", "日"];
  var html = '<h3>近 35 天打卡热力</h3><div class="heat">' +
    '<div class="heat-dow">' + dowNames.map(function(n){ return '<span>' + n + '</span>'; }).join("") + '</div>';
  for (var w = 0; w < 5; w++){
    html += '<div class="heat-row">';
    for (var d = 0; d < 7; d++){
      var cell = weeks[w][d];
      var future = cell.k > todayKey();
      html += '<div class="heat-cell l' + lvl(cell) + (future ? " future" : "") + '"' +
        ' title="' + fmtDate(cell.k) + " 周" + dowNames[d] +
        (cell.n ? " · " + cell.n + " 次打卡" + (cell.mins ? " · " + cell.mins + " 分钟" : "") : " · 没打卡") + '"></div>';
    }
    html += '</div>';
  }
  html += '</div><div class="heat-legend"><span>少</span>' + [1,2,3,4].map(function(i){ return '<i class="heat-cell l' + i + '"></i>'; }).join("") + '<span>多</span></div>';
  var dayCnt = 0, minCnt = 0;
  weeks.forEach(function(row){
    row.forEach(function(c){
      if (c.k <= todayKey() && c.n){ dayCnt++; minCnt += c.mins; }
    });
  });
  if (!dayCnt){
    html += '<div class="heat-sum">近 35 天还没有打卡记录</div>';
  } else {
    html += '<div class="heat-sum">近 35 天打卡 <b>' + dayCnt + '</b> 天' + (minCnt ? ' · 共 <b>' + minCnt + '</b> 分钟' : '') + '</div>';
  }
  return html;
}

function chart14(){
  var mobile = window.innerWidth < 640;
  var N = mobile ? 7 : 14;
  var t = fromKey(todayKey()), days = [];
  for (var i = N - 1; i >= 0; i--) days.push(toKey(addDays(t, -i)));
  var rows = state.goals.map(function(g){
    return { g: g, vals: days.map(function(k){ var m = minutesOn(g.id, k), a = amountOn(g.id, k); return m || a || 0; }) };
  });
  var dayTot = [], max = 0;
  for (var di = 0; di < N; di++){
    var sum = 0;
    rows.forEach(function(r){ sum += r.vals[di]; });
    dayTot.push(sum);
    if (sum > max) max = sum;
  }
  var step, yMax;
  if (max <= 0){ step = 10; yMax = 60; }
  else {
    // 按实际最大分钟数定刻度：先取约 6 段，段数太少再对半折一次
    var raw = max / 6, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
    step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    if (step < 1) step = 1;
    yMax = Math.ceil(max / step) * step;
    var half = step / 2;
    if (yMax / step < 5 && half >= 1 && Math.round(half) === half){
      step = half; yMax = Math.ceil(max / step) * step;
    }
  }
  var ticks = [];
  for (var gv = 0; gv * step <= yMax + 0.001; gv++) ticks.push(Math.round(gv * step));
  var yHtml = ticks.map(function(v){
    return '<span style="bottom:' + (v / yMax * 100).toFixed(2) + '%">' + v + '</span>';
  }).join("");
  var lineHtml = ticks.map(function(v){
    if (v === 0) return "";
    return '<i class="c14-line" style="bottom:' + (v / yMax * 100).toFixed(2) + '%"></i>';
  }).join("");
  var cols = days.map(function(k, idx){
    var segs = rows.map(function(r){
      var v = r.vals[idx];
      if (!v) return "";
      return '<i style="height:' + (v / yMax * 100).toFixed(2) + '%;background:' + r.g.color + '" title="' + esc(r.g.name) + ' ' + v + ' 分钟"></i>';
    }).join("");
    return '<div class="c14-col" title="' + fmtDate(k) + ' · ' + (dayTot[idx] || 0) + ' 分钟"><div class="c14-bar">' + segs + '</div></div>';
  }).join("");
  var xHtml = days.map(function(k){
    var on = k === todayKey();
    return '<span' + (on ? ' class="on"' : "") + '>' + fmtShort(k) + '</span>';
  }).join("");
  return '<div class="c14' + (mobile ? ' c14-m' : '') + '">' +
    '<div class="c14-y">' + yHtml + '</div>' +
    '<div class="c14-plot">' + lineHtml +
      '<div class="c14-cols">' + cols + '</div>' +

    '</div>' +
    '<div class="c14-x">' + xHtml + '</div>' +
  '</div>';
}

    var dcls = c > p ? "up" : (c < p ? "down" : "flat");
    var cDays = activeDays(g, cur), pDays = activeDays(g, prev);
    var cMin = minutesSum(g, cur), pMin = minutesSum(g, prev);
    rowsH += '<tr>' +
      '<td class="wk-n"><i class="gdot" style="background:' + g.color + '"></i><span>' + esc(g.name) + '</span></td>' +
      '<td><b>+' + c + '</b> <em>' + esc(g.unit) + '</em><span class="wk-sub">· ' + cDays + ' 天 · ' + cMin + ' 分钟</span></td>' +
      '<td class="wk-prev">+' + p + ' <em>' + esc(g.unit) + '</em><span class="wk-sub">· ' + pDays + ' 天 · ' + pMin + ' 分钟</span></td>' +
      '<td class="delta ' + dcls + '">' + deltaPct(c, p) + '</td></tr>';
    var mi = missInfo(g);
    if (mi && mi.type === "overdue") over++;
    var s = streak(g);
    if (s > best) best = s;
  });
  h += '<table class="wk-tbl"><thead><tr><th>科目</th><th>本周</th><th>上周</th><th class="ta-r">变化</th></tr></thead><tbody>' + rowsH + '</tbody></table>';
  var active = 0;

    var k = toKey(addDays(fromKey(cur.mon), dd));

  }
  var curN = state.records.filter(function(r){ return r.date >= cur.mon && r.date <= cur.sun; }).length;
  var prevN = state.records.filter(function(r){ return r.date >= prev.mon && r.date <= prev.sun; }).length;
  h += '<div class="week-compare">' +
    '<span>本周 <b>' + curN + '</b> 次打卡 · ' + active + ' 天 · ' + minSum(cur) + ' 分钟</span>' +
    '<span class="dim">上周 ' + prevN + ' 次 · ' + activeDaysAll(prev) + ' 天 · ' + minSum(prev) + ' 分钟</span>' +
    '<span class="delta ' + (curN > prevN ? 'up' : (curN < prevN ? 'down' : 'flat')) + '">' + deltaPct(curN, prevN) + '</span>' +
    '</div></div>';
  var rv = state.reviews[cur.mon] || { keep: "", problem: "", try: "", plan: "" };
  h += '<div class="card"><h3>本周复盘<span class="hsub">先写这四句，写完生成周报</span></h3>' +
    '<div class="rv-grid">' +
    '<div class="rv-cell"><label class="rlab">保持 Keep · 做得好的，下周继续</label><textarea id="rvKeep" rows="2" placeholder="例：单词连续 6 天没断">' + esc(rv.keep) + '</textarea></div>' +
    '<div class="rv-cell"><label class="rlab">问题 Problem · 卡在哪了</label><textarea id="rvProblem" rows="2" placeholder="例：阅读总拖到睡前，一躺下就刷手机">' + esc(rv.problem) + '</textarea></div>' +
    '<div class="rv-cell"><label class="rlab">尝试 Try · 下周试试这样改</label><textarea id="rvTry" rows="2" placeholder="例：阅读改到午饭后 20 分钟">' + esc(rv.try) + '</textarea></div>' +
    '<div class="rv-cell"><label class="rlab">下周预案 · 如果…我就…</label><textarea id="rvPlan" rows="2" placeholder="例：如果睡前想刷手机，我就先读 2 页">' + esc(rv.plan) + '</textarea></div>' +
    '</div><div style="margin-top:14px"><button class="btn block" data-act="save-review">保存复盘</button></div></div>' +
    '<div class="card"><h3>周报文本<span class="hsub">把本周复盘一起带进去</span></h3>' +
    '<textarea id="weekOut" class="weekout" readonly></textarea>' +
    '<div style="margin-top:10px"><button class="btn block" data-act="gen-week">生成并复制周报文本</button></div></div>' +
    reviewWeekCard(cur);
  $("tab-week").innerHTML = h;
  var wo = $("weekOut");

function reviewWeekCard(cur){

function buildWeekText(cur, prev, curAll, prevAll, over, best){
  var connected = !!(state.obsidianInfo && state.obsidianInfo.dir);
  var L = [];
  L.push("【考研学习周报】" + fmtDate(cur.mon) + " – " + fmtDate(cur.sun));
  var ed = examDays();
  L.push("");
  L.push("一、本周打卡");
  var autos = state.goals.filter(function(g){ return g.obsidian && connected; });
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var c = weekSum(g, cur);
    L.push("· " + g.name + "：" + c + " / " + g.total + " " + g.unit + "（本周 +" + c + "）");
  });
  if (autos.length) L.push("· Obsidian 自动统计：" + autos.map(function(g){ return g.name; }).join("、") + "（进度随 Obsidian 更新，无需打卡）");
  L.push("");
  var curN2 = state.records.filter(function(r){ return r.date >= cur.mon && r.date <= cur.sun; }).length;
  var prevN2 = state.records.filter(function(r){ return r.date >= prev.mon && r.date <= prev.sun; }).length;
  L.push("二、比上周：" + deltaPct(curN2, prevN2) + "（本周 " + curN2 + " 次打卡，累计 " + curAll + "）");
  var tcount = { study: 0, review: 0, practice: 0, recite: 0 };
  state.records.forEach(function(r){ if (r.date >= cur.mon && r.date <= cur.sun && tcount[r.type] != null) tcount[r.type]++; });
  L.push("· 本周类型：学习 " + tcount.study + " 次 · 复习 " + tcount.review + " 次 · 练习 " + tcount.practice + " 次 · 背诵 " + tcount.recite + " 次");
  L.push("");
  L.push("三、复盘");
  var wkLog = (state.rvLog || []).filter(function(x){ return x.date >= cur.mon && x.date <= cur.sun; });
  if (wkLog.length){
    var wkBy = {};
    wkLog.forEach(function(x){ var k = x.subj || "其他"; wkBy[k] = (wkBy[k] || 0) + 1; });
    L.push("· 本周复盘 " + wkLog.length + " 条（" + Object.keys(wkBy).map(function(k){ return k + " " + wkBy[k]; }).join(" · ") + "）");
  }
  var bg = null, bc = -1;
  state.goals.forEach(function(g){ if (g.obsidian && connected) return; var c = weekSum(g, cur); if (c > bc) { bc = c; bg = g; } });
  if (bg) L.push("· 完成最好：" + bg.name + "（" + bc + "）");
  var bads = state.goals.filter(function(g){ return !(g.obsidian && connected) && weekSum(g, cur) <= 0; });
  if (bads.length) L.push("· 需要加强：" + bads.map(function(g){ return g.name; }).join("、") + "（本周未打卡）");
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var e2 = eta(g), rem2 = remaining(g);
    if (e2 && rem2 > 0){
      var dl = new Date(g.deadline + "T00:00:00"), ev = new Date(e2 + "T00:00:00");
      var diff = Math.round((dl.getTime() - ev.getTime()) / 86400000);
      if (diff > 0) L.push("· 进度超前：" + g.name + " 预计 " + fmtDate(e2) + " 完成，比截止提前 " + diff + " 天");
      else if (diff < 0) L.push("· 进度告急：" + g.name + " 按当前速度将逾期 " + (-diff) + " 天，建议每天加大到 ≥ " + suggest(g).v + " " + g.unit);
    }
  });
  L.push("· 最长连续：" + best + " 天" + (over ? "；逾期目标 " + over + " 个" : ""));
  L.push("");
  L.push("四、下周建议");
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var sg = suggest(g);
    if (sg.v > 0) L.push("· " + g.name + "：建议每日 ≥ " + sg.v + " " + g.unit);
    else if (sg.note) L.push("· " + g.name + "：" + sg.note);
  });
  if (over) L.push("· 先把逾期目标补记或调整，别让它拖进度。");
  var rv = state.reviews && state.reviews[cur.mon];
  if (rv && (rv.keep || rv.problem || rv.try || rv.plan)){
    L.push("");
    L.push("五、手写复盘");
    if (rv.keep) L.push("· Keep：" + rv.keep);
    if (rv.problem) L.push("· Problem：" + rv.problem);
    if (rv.try) L.push("· Try：" + rv.try);
    if (rv.plan) L.push("· 预案：" + rv.plan);
  }
  return L.join("\n");
}

function leaveHistory(){
  var lv = leaveDates();
  var leaves = state.settings.leaveDays || [];
  var tk = todayKey(), t = fromKey(tk);
  var firstDay = state.records.reduce(function(m, r){ return (!m || r.date < m) ? r.date : m; }, "");
  var rows = [];
  for (var i = 0; i < 30; i++){
    var k = toKey(addDays(t, -i));
    var has = state.records.some(function(r){ return r.date === k; });
    var isLeave = lv.indexOf(k) >= 0;
    if (isLeave){
      var meta = null;
      for (var j = 0; j < leaves.length; j++) if (normDate(leaves[j].date) === k) meta = leaves[j];
      rows.push({ k: k, type: has ? "leavedone" : "leave", note: (meta && meta.note) || "", raw: meta ? meta.date : k });
    } else if (firstDay && k >= firstDay && k !== tk && !has){
      rows.push({ k: k, type: "miss", note: "", raw: k });
    }
  }
  if (!rows.length) return '<div class="lh-empty">最近 30 天没有缺卡。请假会以黄色记在这里。</div>';
  var shown = rows.slice(0, 12);
  var html = shown.map(function(r){
    var day = fmtShort(r.k) + " " + weekdayName(fromKey(r.k));
    if (r.type === "miss"){
      return '<div class="lh-row miss"><span class="lh-dot"></span><span class="lh-d">' + day + '</span>' +

    return '<div class="lh-row ' + r.type + '"><span class="lh-dot"></span><span class="lh-d">' + day + '</span>' +
      '<span class="lh-tag">请假</span><span class="lh-note">' + note + '</span>' +
      '<button class="lh-btn del" data-act="del-leave" data-date="' + r.raw + '">删</button></div>';
  }).join("");
  var foot = rows.length > shown.length ? '只列最近 12 条' : "";
  var missN = 0, leaveN = 0, doneN = 0;
