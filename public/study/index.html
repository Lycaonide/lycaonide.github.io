<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>学习打卡 · 考研进度管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232EA88C'/%3E%3Cpath d='M9 12l2 2 4-4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#2563EB;--brand2:#1D4ED8;--brand-ink:#1E40AF;
  --ink:#0F172A;--ink2:#475569;--muted:#64748B;
  --bg:#FFFFFF;--card:#FFFFFF;--line:#CBD5E1;
  --amber:#E8A33D;--red:#E25B5B;--blue:#2563EB;--green:#16A34A;--rose:#E882B0;
  --grad:#2563EB;
  --grad-soft:#FFFFFF;
  --shadow-sm:none;
  --shadow-md:none;
  --r-lg:12px;--r-md:8px;--r-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
::selection{background:rgba(37,99,235,.18)}

/* ===== 顶栏 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:#F8FAFC;border-right:1px solid #CBD5E1;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:0 40px 20px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.back-link{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0;background:transparent;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;order:2;margin-top:0;margin-right:12px}
.back-link:hover{color:var(--brand)}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{width:16px;height:16px;stroke:#fff}
.brand h1{font-size:18px;font-weight:700;letter-spacing:0;white-space:nowrap;color:var(--ink)}
.brand h1 em{font-style:normal;color:var(--brand-ink)}
.date{font-size:13px;color:var(--muted);padding:0 0 16px;white-space:nowrap;align-self:flex-start}

/* ===== Tab 栏：侧边竖排 ===== */
.tabs{display:flex;flex-direction:column;gap:4px}
.tab-btn{min-height:36px;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:8px;padding:0 12px;transition:color .15s,background .15s;text-align:left}
.tab-btn:hover{background:#EEF2F7;color:var(--ink)}
.tab-btn.active{background:var(--brand);color:#fff;box-shadow:none;border-radius:6px}
.tab-btn svg{width:18px;height:18px;flex:none}

/* ===== 主区 ===== */
main{flex:1;min-width:0;padding:24px 32px calc(48px + env(safe-area-inset-bottom))}
main > *{max-width:1000px;margin-left:auto;margin-right:auto}

/* 手机端：侧边栏收成顶部横排 */
@media(max-width:767px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:column;gap:8px;padding:10px 14px;border-right:none;border-bottom:1px solid rgba(225,237,231,.8);z-index:20}
  .sb-brand{flex-direction:row;align-items:center;justify-content:space-between}
  .tabs{flex-direction:row}
  .tab-btn{flex:1;justify-content:center;padding:0;min-height:42px;font-size:13px}
  main{padding:12px 14px calc(80px + env(safe-area-inset-bottom))}
}
.card{background:var(--card);border:1px solid #CBD5E1;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{font-size:20px;font-weight:600;letter-spacing:.2px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--grad);flex:none}

/* 每日一句 */
.quote{position:relative;background:transparent;border:none;border-bottom:1px solid #CBD5E1;padding:0 0 16px;overflow:hidden;margin-bottom:16px}
.quote .qtext{font-size:20px;font-weight:700;color:var(--ink);line-height:1.4}
.quote::before{content:"“";position:absolute;right:14px;top:-10px;font-size:92px;line-height:1;color:rgba(37,99,235,.14);font-family:Georgia,serif;pointer-events:none}
.quote .q{font-size:16px;line-height:1.75;font-weight:600;color:var(--ink)}
.quote .qtag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:700;color:var(--brand-ink);background:rgba(37,99,235,.12);border-radius:999px;padding:3px 10px;letter-spacing:1px}

/* 漏卡提示 */
.miss{--mcol:var(--amber);background:linear-gradient(180deg,#FFFBF2,#FFF7E6);border-color:rgba(232,163,61,.28)}
.miss.red{--mcol:var(--red);background:linear-gradient(180deg,#FFF6F4,#FEEBE9);border-color:rgba(226,91,91,.28)}
.miss-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.miss-head b{font-size:14.5px}
.miss-dot{width:10px;height:10px;border-radius:50%;background:var(--mcol);flex:none;box-shadow:0 0 0 4px rgba(232,163,61,.15)}
.miss.red .miss-dot{box-shadow:0 0 0 4px rgba(226,91,91,.15)}
.miss p{font-size:13px;color:var(--ink2)}
.miss-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* 目标卡片 */
.gcard{--gc:var(--brand)}
.ghead{display:flex;align-items:center;gap:9px}
.gdot{width:11px;height:11px;border-radius:4px;background:var(--gc);flex:none}
.gname{font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;flex:none}
.blink{font-size:12px;font-weight:600;color:#2563EB;text-decoration:none;flex:none;padding:2px 0;white-space:nowrap}
.blink:hover{text-decoration:underline}
.chip.ok{background:rgba(37,99,235,.13);color:var(--brand-ink)}
.chip.info{background:rgba(74,144,217,.12);color:#2F6FAD}
.chip.warn{background:rgba(232,163,61,.15);color:#A86F12}
.chip.bad{background:rgba(226,91,91,.12);color:#C04444}
.gbar{height:8px;border-radius:5px;background:#EDF4F0;margin:14px 0 4px;overflow:hidden;position:relative}
.gfill{height:100%;border-radius:5px;background:var(--gc);transition:width .35s cubic-bezier(.22,.61,.36,1);position:relative}
.gfill::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:rgba(255,255,255,.22);border-radius:inherit}
.gmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gmeta .cell{background:#F8FAFC;border:1px solid #EEF2F7;border-radius:8px;padding:6px 8px;text-align:center}
.gmeta .cell .k{font-size:12px;color:var(--muted);display:block;font-weight:600;letter-spacing:.3px}
.gmeta .cell .v{font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.gmeta .cell .v small{font-weight:600;color:var(--muted);font-size:11px}
.gact{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:end;margin-top:14px}
.gact .field label{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.gact input{width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:10px 11px;background:#FBFDFC;min-height:44px;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.gact input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.gact .ttype{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px}
.gact .btn.primary{grid-column:auto}
.unit-holder{position:relative}
.unit-holder input{padding-right:36px}
.unit-holder .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;font-weight:600}
.reclist{margin-top:14px;border-top:1px dashed #CBD5E1;padding-top:10px}
.rl-title{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;letter-spacing:.3px}
.rec{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.rec .amt{font-weight:600;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.rec .tag{font-size:10px;background:rgba(37,99,235,.12);color:var(--brand-ink);border-radius:6px;padding:2px 7px;font-weight:700}
.rec .time{margin-left:auto;color:var(--muted);font-size:12px}
.obstacle{margin-top:12px;font-size:13.5px;color:var(--ink2);background:#FBFDFC;border:1px dashed #CBD5E1;border-radius:12px;padding:9px 11px;line-height:1.6}
.obstacle b{color:var(--ink);font-weight:700}
.auto-hint{margin-top:10px;font-size:14px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:6px 10px;font-weight:600}
.auto-sub{margin-top:6px;font-size:13.5px;color:var(--ink2);font-weight:500}
.examline{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--brand-ink);background:linear-gradient(90deg,rgba(37,99,235,.12),rgba(37,99,235,.04));border:1px solid rgba(37,99,235,.2);border-radius:12px;padding:10px 14px}
.review-today{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--amber);background:#FFFBF2}
.rv-icon{font-size:20px;color:var(--amber);flex:none;line-height:1.2}
.rv-body b{font-size:15px}
.rv-overdue{color:var(--red);font-weight:700}
.rv-sub{font-size:13px;color:var(--muted);margin-top:3px}
.addcard{width:100%;margin-top:14px;padding:16px;border:1.5px dashed rgba(37,99,235,.4);border-radius:16px;background:rgba(37,99,235,.04);color:var(--brand-ink);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.addcard:hover{background:rgba(37,99,235,.1)}
.tmpls{display:flex;flex-wrap:wrap;gap:8px}
.tmpl{font-size:12px;font-weight:600;color:var(--brand-ink);background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.25);border-radius:999px;padding:5px 11px;cursor:pointer}
.tmpl:hover{background:rgba(37,99,235,.16)}
.ttype{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tt{font-size:14px;font-weight:600;color:var(--muted);background:#F2F6F4;border:1.5px solid #E3ECE7;border-radius:10px;padding:10px 0;cursor:pointer;text-align:center;transition:all .15s}
.tt.on{background:rgba(37,99,235,.12);border-color:var(--brand);color:var(--brand-ink)}
.tt.on{color:var(--brand-ink);background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.35)}
.ttag{background:rgba(37,99,235,.1);color:var(--brand-ink)}
.obs-path{margin-top:8px;width:100%;padding:9px 11px;border:1px solid #DCE7E1;border-radius:10px;font-size:14px;box-sizing:border-box}
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.ov{background:var(--card);border:1px solid #CBD5E1;border-radius:8px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.ov-v{font-size:24px;font-weight:600;color:var(--brand-ink)}
.ov-k{font-size:11px;color:var(--muted)}
.rhythm{margin-top:14px}
.rh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.rh-head span{color:var(--muted);font-size:12px}
.rh-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rh-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:10px;background:#F2F6F4}
.rh-cell .rh-d{font-size:11px;color:var(--muted)}
.rh-cell .rh-c{font-size:12px;font-weight:700;color:var(--muted)}
.rh-cell.on{background:rgba(37,99,235,.12)}
.rh-cell.on .rh-c{color:var(--brand-ink)}
.rh-cell.today{outline:2px solid var(--brand)}
.heat{display:flex;gap:4px;justify-content:center}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:800px){.two-col{grid-template-columns:1fr}}
.heat-col{display:flex;flex-direction:column;gap:3px}
.heat-cell{width:16px;height:16px;border-radius:3px;background:#EDF2F0}
.heat-cell.l1{background:#DBEAFE}
.heat-cell.l2{background:#93C5FD}
.heat-cell.l3{background:#2563EB}
.heat-cell.l4{background:#1D4ED8}
.heat-cell.future{opacity:.25}
.heat-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.heat-legend .heat-cell{width:14px;height:14px}
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #EFF4F2;font-size:14px}
.feed-row:last-child{border-bottom:none}
.feed-n{font-weight:600;min-width:90px}
.feed-a{color:var(--muted);flex:1}
.feed-d{color:var(--muted);font-size:13px;white-space:nowrap}
.rlab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.tdist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.td-cell{background:#EFF6FF;border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.td-name{font-size:12px;color:var(--muted);font-weight:600}
.td-n{font-size:18px;font-weight:600;color:var(--brand-ink)}
.td-m{font-size:12px;color:var(--muted)}
.cl-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.cl-legend span{display:flex;align-items:center;gap:4px}
.cl-list{display:flex;flex-direction:column}
.cl-row{display:block;border-bottom:1px solid #EFF4F1;padding:0}
.cl-row summary{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none;font-size:14px}
.cl-row summary::-webkit-details-marker{display:none}
.cl-row[open] summary{border-bottom:1px solid #EFF4F1}
.cl-items{padding:8px 0 8px 44px}
.cl-item{padding:10px 0;border-bottom:1px dashed #F0F4F8}
.cl-item:last-child{border-bottom:none}
.ci-head{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ci-head i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.ci-point{font-size:12px;color:var(--muted);margin:3px 0}
.ci-chain{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.ci-next{color:var(--brand-ink);font-weight:600}
.cl-no{font-weight:600;color:var(--brand-ink);font-size:16px}
.cl-name{font-weight:700;font-size:15px}
.cl-count{color:var(--muted);font-size:13px}
.cl-lv{display:flex;gap:4px}
.cl-lv i,.cl-legend i{font-style:normal;font-size:12px;padding:2px 7px;border-radius:8px;font-weight:700;white-space:nowrap}
.lv-a{background:#DBEAFE;color:#1E40AF}
.lv-b{background:#FEF3C7;color:#92400E}
.lv-c{background:#FEE2E2;color:#991B1B}
.cl-due{color:var(--red);font-weight:700;font-size:13px}
.cl-week{color:var(--amber);font-size:13px}
.cl-ok{color:var(--muted);font-size:13px}
.rlab ~ textarea, .card textarea.weekout{width:100%;box-sizing:border-box;border:1px solid #DCE7E1;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical}
.wn-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wline{font-size:14px}
.wline.dim{font-size:14px;color:var(--muted)}
@media (max-width:640px){
  .ov-grid{grid-template-columns:repeat(2,1fr)}
  .feed-n{min-width:0}
  .heat-cell{width:18px;height:18px}
  .tdist{grid-template-columns:repeat(2,1fr)}
  .cl-row{grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;row-gap:6px;align-items:center}
  .cl-name{grid-row:1;grid-column:2}
  .cl-count{grid-row:1;grid-column:3;justify-self:end}
  .cl-lv{grid-row:2;grid-column:2}
  .cl-due,.cl-week,.cl-ok{grid-row:2;grid-column:3;justify-self:end}
}
.gadd{margin-top:14px;text-align:center}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;background:var(--brand);color:#fff;transition:background .15s;box-shadow:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--grad);color:#fff}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid #CBD5E1;box-shadow:none}
.btn.plain{background:transparent;color:#2F6FAD;min-height:36px;padding:4px 8px;font-weight:700;box-shadow:none}
.btn.danger{background:#FCEFED;color:#C04444;box-shadow:none}
.btn.sm{min-height:36px;height:36px;padding:0 14px;font-size:13px;border-radius:8px;box-shadow:none;box-sizing:border-box}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:none}

/* ===== 看板 ===== */
.board-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:768px){.board-grid{grid-template-columns:repeat(4,1fr)}}
.bcard{text-align:center;padding:20px 14px 16px}
.bcard .ring{display:block;margin:0 auto}
.bname{font-size:13.5px;font-weight:600;margin-top:10px;letter-spacing:.2px}
.bstats{font-size:12px;color:var(--muted);margin-top:4px}
.bchip{margin-top:10px;display:inline-block}
.chart-card h3{font-size:14px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend i{width:10px;height:10px;border-radius:4px;flex:none}

/* ===== 周报 ===== */
.weekhead{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.3px}
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed #CBD5E1}
.wrow:last-child{border-bottom:none}
.wrow .gdot{width:9px;height:9px;border-radius:3px;flex:none}
.wrow .wn{flex:1;min-width:0;font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wv{font-size:12.5px;color:var(--muted);white-space:nowrap}
.wrow .wv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600;white-space:nowrap;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:var(--brand-ink)}
.delta.down{color:#C04444}
.delta.flat{color:var(--muted)}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.week-compare{display:flex;gap:16px;align-items:center;padding:10px 14px;background:#F8FAFC;border-radius:8px;font-size:13px;color:var(--ink2);margin:12px 0}
.week-compare b{color:var(--brand-ink);font-weight:600}
.week-compare .dim{color:var(--muted)}
.week-compare .delta{margin-left:auto}
.fcell{background:#fff;border:1px solid #CBD5E1;border-radius:8px;padding:12px 14px}
.fcell .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.fcell .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.fcell .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.fcell .v.small{font-size:14px;line-height:1.55;font-weight:600}

<script>
/* ================= 数据 ================= */
var LS = "study-tracker-v1";
var REC_TYPES = [["study", "学习"], ["review", "复习"], ["practice", "练习"], ["recite", "背诵"]];
function typeName(t){
  for (var i = 0; i < REC_TYPES.length; i++) if (REC_TYPES[i][0] === t) return REC_TYPES[i][1];
  return "学习";
}
var state = load();

function defaultState(){
  return {
    version: 1,
    goals: [
      {id:"g1", name:"考研数学 · 讲义", unit:"讲", total:20, deadline:"2027-12-20", color:"#2563EB", base:0, obsidian:"math-notes", obstacle:"", countermeasure:""},
      {id:"g2", name:"考研英语 · 每日一句", unit:"句", total:100, deadline:"2027-12-20", color:"#4A90D9", base:0, obsidian:"sentence", obstacle:"", countermeasure:""},
      {id:"g3", name:"考研英语 · 单词", unit:"词", total:6024, deadline:"2027-12-20", color:"#E8A33D", base:581, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g4", name:"408 · 数据结构", unit:"轮", total:3, deadline:"2027-09-30", color:"#E25B5B", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g5", name:"408 · 计算机组成原理", unit:"轮", total:3, deadline:"2027-09-30", color:"#7FB069", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g6", name:"408 · 操作系统", unit:"轮", total:3, deadline:"2027-09-30", color:"#E882B0", base:0, obsidian:"", obstacle:"", countermeasure:""},
      {id:"g7", name:"408 · 计算机网络", unit:"轮", total:3, deadline:"2027-09-30", color:"#C77D5A", base:0, obsidian:"", obstacle:"", countermeasure:""}
    ],
    records: [],
    obsidianCounts: {},
    obsidianInfo: { dir: "", ts: 0, supported: false },
    settings: {
      restWeekday: 7, leaveDays: [],
      sentenceBank: [
        "道阻且长，行则将至；行而不辍，未来可期。",
        "种一棵树最好的时间是十年前，其次是现在。",
        "流水不争先，争的是滔滔不绝。",
        "知不足而奋进，望远山而前行。",
        "博观而约取，厚积而薄发。",
        "日拱一卒，功不唐捐。",
        "慢慢来，比较快。",
        "所有的为时已晚，其实都是恰逢其时。"
      ],
      dailySentence: ""
    },
    dismissed: {},
    lastBackup: 0
  };
}
function normalize(s){
  var d = defaultState();
  s.settings = Object.assign({}, d.settings, s.settings || {});
  s.dismissed = s.dismissed && typeof s.dismissed === "object" ? s.dismissed : {};
  s.goals = (Array.isArray(s.goals) ? s.goals : []).filter(function(g){ return g && g.id && g.name && g.total != null && g.deadline; })
    .map(function(g){
      return { id: String(g.id), name: String(g.name), unit: String(g.unit || "次"), total: +g.total || 0,
        deadline: String(g.deadline), color: g.color || d.goals[0].color,
        base: +g.base || 0,
        obsidian: (g.obsidian === "math-notes" || g.obsidian === "sentence" || /^dir:/.test(g.obsidian) || /^tbl:/.test(g.obsidian)) ? g.obsidian : "",
        obstacle: String(g.obstacle || ""), countermeasure: String(g.countermeasure || "") };
    });
  s.records = (Array.isArray(s.records) ? s.records : []).filter(function(r){
    return r && r.goalId && r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && (+r.amount) > 0;
  }).map(function(r){
    var t = String(r.type || "study");
    var okT = REC_TYPES.some(function(x){ return x[0] === t; });
    return { id: String(r.id || uid()), goalId: String(r.goalId), date: String(r.date), amount: +r.amount,
      minutes: +r.minutes || 0, backfill: !!r.backfill, type: okT ? t : "study", ts: r.ts || 0 };
  });
  s.obsidianCounts = s.obsidianCounts && typeof s.obsidianCounts === "object" ? s.obsidianCounts : {};
  s.obsidianInfo = s.obsidianInfo && typeof s.obsidianInfo === "object"
    ? Object.assign({ dir: "", ts: 0, supported: false, examDate: "", mathChapters: [], sentenceLast: "", reviewToday: 0, reviewOverdue: 0 }, s.obsidianInfo)
    : { dir: "", ts: 0, supported: false, examDate: "", mathChapters: [], sentenceLast: "", reviewToday: 0, reviewOverdue: 0 };
  s.lastBackup = +s.lastBackup || 0;
  s.reviews = s.reviews && typeof s.reviews === "object" ? s.reviews : {};
  if (!s.goals.length) s.goals = d.goals;
  return s;
}
function load(){
  try {
    var raw = localStorage.getItem(LS);
    if (raw) { var s = JSON.parse(raw); if (s && Array.isArray(s.goals)) return normalize(s); }
  } catch (e) {}
  return normalize(defaultState());
}
function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

/* ================= Obsidian 自动同步（桌面 Edge/Chrome） ================= */
function obsSupported(){ return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function"; }
function idbOpen(){
  return new Promise(function(res, rej){
    var r = indexedDB.open("study-obsidian", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction("kv", "readonly").objectStore("kv").get(key);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function idbSet(key, val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(val, key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbDel(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function descend(root, parts){
  if (!parts.length) return Promise.resolve(root);
  var head = parts[0], rest = parts.slice(1);
  if (/\.md$/.test(head)){
    return root.getFileHandle(head);
  }
  return root.getDirectoryHandle(head).then(function(h){ return descend(h, rest); });
}
function countMathNotes(dir){
  return Promise.resolve().then(async function(){
    return ["00"];
  });
}
function countSentences(file){
  return file.text().then(function(txt){
    var re = /20\d{2}-\d{1,2}-\d{1,2}/, n = 0, last = "";
    txt.split("\n").forEach(function(line){
      if (re.test(line)){
        n++;
        last = (line.match(re) || [""])[0];
      }
    });
    return { n: n, last: last };
  });
}
function readExamDate(dir){
  return (dir.getFileHandle ? dir.getFileHandle("复盘中心.md") : Promise.reject(new Error("no-api")))
    .then(function(h){ return h.getFile(); }).then(function(f){ return f.text(); })
    .then(function(txt){ var m = /exam_date:\s*(\d{4}-\d{1,2}-\d{1,2})/.exec(txt); return m ? m[1] : ""; })
    .catch(function(){ return ""; });
}
function hasObsidian(k){ return !!k; }
function readObsidian(root){
  var counts = {}, info = { examDate: "", mathChapters: [], sentenceLast: "", reviewToday: 0, reviewDue: 0 };
  var jobs = [];
  state.goals.forEach(function(g){
    if (!g.obsidian) return;
    var o = g.obsidian;
    if (o === "math-notes"){
      jobs.push(descend(root, ["考研", "数学", "零基础通关讲义"]).then(function(dir){
        return countMathNotes(dir).then(function(names){
          counts[o] = names.length; info.mathChapters = names;
          return readExamDate(dir);
        }).then(function(d){ info.examDate = d; });
      }).catch(function(e){ console.warn("math-notes:", e); }));
    } else if (o === "sentence"){
      jobs.push(descend(root, ["考研", "英语", "每日一句", "完成进度（不做真题先听2010-2019）.md"])
        .then(function(h){ return h.getFile(); }).then(countSentences).then(function(r){
          counts[o] = r.n; info.sentenceLast = r.last;
        }).catch(function(e){ console.warn("sentence:", e); }));
    } else if (o.indexOf("dir:") === 0){
      var rel = o.slice(4);
      jobs.push(descend(root, rel.split("/")).then(countMathNotes).then(function(names){ counts[o] = names.length; }).catch(function(e){ console.warn("dir:", e); }));
    } else if (o.indexOf("tbl:") === 0){
      var rel2 = o.slice(4);
      jobs.push(descend(root, rel2.split("/")).then(function(h){ return h.getFile(); }).then(countSentences).then(function(r){ counts[o] = r.n; }).catch(function(e){ console.warn("tbl:", e); }));
    }
  });
  // 固定读复盘中心：今天到期未打勾的题数
  jobs.push(descend(root, ["考研", "数学", "零基础通关讲义", "复盘中心.md"])
    .then(function(h){ return h.getFile(); })
    .then(function(f){ return f.text(); })
    .then(function(txt){
      var today = todayKey();
      var todayDue = 0, overdue = 0;
      txt.split("\n").forEach(function(line){
        var m = /^- \[ \] 复盘 .+?\(@(\d{4}-\d{1,2}-\d{1,2})/.exec(line);
        if (!m) return;
        var d = m[1];
        if (d === today) todayDue++;
        else if (d < today) overdue++;
      });
      info.reviewToday = todayDue; info.reviewOverdue = overdue;
    }).catch(function(){ info.reviewToday = 0; info.reviewOverdue = 0; }));
  // 遍历所有 0X-*.md 章节，读台账数据，聚合成章节闭环视图
  jobs.push(descend(root, ["考研", "数学", "零基础通关讲义"])
    .then(function(dir){
      var CHAP_NAMES = { "01":"基本逻辑", "02":"解析式", "03":"方程与不等式", "04":"函数", "05":"数列", "06":"坐标系" };
      var chapMap = {};
      return Promise.resolve().then(async function(){
        var entries = [];
        for await (const e of dir.values()) entries.push(e);
        var fileEntries = entries.filter(function(e){ return e.kind === "file" && /^\d{2}-.*\.md$/.test(e.name); });
        for (var fi = 0; fi < fileEntries.length; fi++){
          var e = fileEntries[fi];
          var txt = await e.getFile().then(function(f){ return f.text(); });
          var no = e.name.slice(0, 2);
          if (!chapMap[no]) chapMap[no] = { no: no, name: CHAP_NAMES[no] || "", total: 0, A: 0, B: 0, C: 0, dueToday: 0, dueWeek: 0, items: [] };
            var today = todayKey();
            var weekEnd = toKey(addDays(fromKey(today), 7));
            var blocks = txt.split("#### 台账数据").pop().split(/\n\s*\n/);
            blocks.forEach(function(b){
              if (!/title::/.test(b)) return;
              function field(name){
                var m = new RegExp(name + "::\\s*(.+)").exec(b);
                return m ? m[1].trim() : "";
              }
              var iv = parseFloat(field("interval"));
              if (!(iv >= 1)) iv = ({ C: 2, B: 4, A: 15 })[field("level").toUpperCase()] || 2;
              var lv = iv >= 15 ? "A" : (iv >= 4 ? "B" : "C");
              var last = field("last_review") || field("study_date");
              var next = last ? toKey(addDays(fromKey(last), iv)) : "";
              chapMap[no].total++;
              chapMap[no][lv]++;
              if (next <= today) chapMap[no].dueToday++;
              else if (next <= weekEnd) chapMap[no].dueWeek++;
              chapMap[no].items.push({
                title: field("title"), point: field("point"),
                study: field("study_date"), times: parseInt(field("times")) || 0,
                last: last, next: next, lv: lv
              });
            });
        }
      }).then(function(){
        info.chapterLoop = Object.keys(chapMap).sort().map(function(k){ return chapMap[k]; });
      });
    }).catch(function(){ info.chapterLoop = []; }));
  return Promise.all(jobs).then(function(){ return { counts: counts, info: info }; });
}
function applyObsidian(counts, info, dirName){
  state.obsidianCounts = counts || {};
  var oi = state.obsidianInfo || {};
  state.obsidianInfo = {
    dir: dirName || oi.dir || "", ts: Date.now(), supported: obsSupported(),
    examDate: (info && info.examDate) || oi.examDate || "",
    mathChapters: (info && info.mathChapters && info.mathChapters.length) ? info.mathChapters : (oi.mathChapters || []),
    sentenceLast: (info && info.sentenceLast) || oi.sentenceLast || "",
    reviewToday: (info && info.reviewToday != null) ? info.reviewToday : (oi.reviewToday || 0),
    reviewOverdue: (info && info.reviewOverdue != null) ? info.reviewOverdue : (oi.reviewOverdue || 0),
    chapterLoop: (info && info.chapterLoop) ? info.chapterLoop : (oi.chapterLoop || [])
  };
  save(); render();
}
function obsConnect(){
  if (!obsSupported()){ toast("当前浏览器不支持，请用桌面版 Edge 或 Chrome"); return; }
  window.showDirectoryPicker({ mode: "read" }).then(function(handle){
    return idbSet("vault", handle).then(function(){
      return handle.queryPermission({ mode: "read" }).then(function(st){
        if (st === "granted") return readObsidian(handle);
        return handle.requestPermission({ mode: "read" }).then(function(st2){
          if (st2 !== "granted") throw new Error("denied");
          return readObsidian(handle);
        });
      });
    }).then(function(res){ applyObsidian(res.counts, res.info, handle.name); toast("Obsidian 已连接并同步"); });
  }).catch(function(e){
    if (e && e.name === "AbortError") return;
    console.error("obsConnect error:", e);
    toast("连接失败：" + (e && e.message ? e.message : "请用 Chrome/Edge 从 https 页面打开，选 Obsidian Vault 根目录"));
  });
}
function obsRefresh(quiet){
  idbGet("vault").then(function(handle){
    if (!handle) throw new Error("none");
    return handle.queryPermission({ mode: "read" }).then(function(st){
      if (st !== "granted") throw new Error("denied");
      return readObsidian(handle);
    }).then(function(res){
      applyObsidian(res.counts, res.info, handle.name);
      if (!quiet) toast("已从 Obsidian 重新统计");
    });
  }).catch(function(){
    if (!quiet) toast("未连接或没有读取权限，请先连接");
  });
}
function obsDisconnect(){
  idbDel("vault").then(function(){
    state.obsidianCounts = {}; state.obsidianInfo = { dir: "", ts: 0, supported: obsSupported() };
    save(); render(); toast("已断开 Obsidian");
  });
}
function obsInit(){
  if (!state.obsidianInfo) state.obsidianInfo = {};
  state.obsidianInfo.supported = obsSupported();
  idbGet("vault").then(function(handle){
    if (!handle) return;
    return handle.queryPermission({ mode: "read" }).then(function(st){
      if (st !== "granted") return;
      return readObsidian(handle).then(function(counts){ applyObsidian(counts, handle.name); });
    });
  }).catch(function(){});
}

/* ================= 日期工具 ================= */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function toKey(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fromKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayKey(){ return toKey(new Date()); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function weekdayCN(d){ var jd = d.getDay(); return jd === 0 ? 7 : jd; }
function fmtDate(k){ var p = k.split("-"); return (+p[1]) + "月" + (+p[2]) + "日"; }
function fmtShort(k){ var p = k.split("-"); return p[1] + "/" + p[2]; }
function fmtTime(ts){ if (!ts) return ""; var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ================= 统计（纯函数） ================= */
function getGoal(id){ for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i]; return null; }
function recsOn(gid, k){ return state.records.filter(function(r){ return r.goalId === gid && r.date === k; }); }
function amountOn(gid, k){ return recsOn(gid, k).reduce(function(s, r){ return s + r.amount; }, 0); }
function minutesOn(gid, k){ return recsOn(gid, k).reduce(function(s, r){ return s + (r.minutes || 0); }, 0); }
function autoCount(g){ if (!g.obsidian) return 0; return (state.obsidianCounts && state.obsidianCounts[g.obsidian]) || 0; }
function doneTotal(g){ return (+g.base || 0) + state.records.reduce(function(s, r){ return r.goalId === g.id ? s + r.amount : s; }, 0) + autoCount(g); }
function remaining(g){ return Math.max(0, (+g.total || 0) - doneTotal(g)); }
function daysLeft(g){ var t = fromKey(todayKey()), dl = fromKey(g.deadline); return Math.round((dl - t) / 86400000) + 1; }
function suggest(g){
  var rem = remaining(g), dl = daysLeft(g);
  if (rem <= 0) return { v: 0, note: "目标已完成" };
  if (dl <= 0) return { v: 0, note: "已到截止日" };
  return { v: Math.ceil(rem / dl), note: "" };
}
function pace7(g){
  var t = fromKey(todayKey()), sum = 0, cnt = 0;
  for (var i = 0; i < 7; i++) { var a = amountOn(g.id, toKey(addDays(t, -i))); sum += a; if (a > 0) cnt++; }
  if (cnt < 3) return null;
  return sum / 7;
}
function eta(g){
  var p = pace7(g);
  if (p === null || p <= 0) return null;
  var rem = remaining(g);
  if (rem <= 0) return todayKey();
  return toKey(addDays(fromKey(todayKey()), Math.ceil(rem / p)));
}
function streak(g){
  var rest = state.settings.restWeekday;
  var d = fromKey(todayKey()), n = 0, miss = 0;
  for (var i = 0; i < 400; i++){
    var k = toKey(d);
    if (amountOn(g.id, k) > 0) { n++; miss = 0; }
    else if (weekdayCN(d) !== rest) { miss++; if (miss >= 2) break; }
    d = addDays(d, -1);
  }
  return n;
}
function missInfo(g){
  if (g.obsidian && state.obsidianInfo && state.obsidianInfo.dir) return null;
  if (!state.records.some(function(r){ return r.goalId === g.id; })) return null;
  if (amountOn(g.id, todayKey()) > 0) return null;
  if (state.dismissed && state.dismissed[g.id] === todayKey()) return null;
  var y = addDays(fromKey(todayKey()), -1), yk = toKey(y);
  if (amountOn(g.id, yk) > 0) return null;
  if (weekdayCN(y) === state.settings.restWeekday) return { type: "rest", days: 0 };
  var leaveDays = (state.settings.leaveDays || []).map(function(l){ return l.date; });
  if (leaveDays.indexOf(yk) >= 0) return { type: "leave", days: 0 };
  var miss = 0, d = y;
  for (var i = 0; i < 60; i++){
    var k = toKey(d);
    if (amountOn(g.id, k) > 0) break;
    if (weekdayCN(d) !== state.settings.restWeekday && leaveDays.indexOf(k) < 0) miss++;
    d = addDays(d, -1);
  }
  if (miss <= 1) return { type: "grace", days: 1 };
  return { type: "overdue", days: miss - 1 };
}
function weekRange(off){
  var t = fromKey(todayKey()), wd = weekdayCN(t);
  var mon = addDays(t, -(wd - 1) + (off || 0) * 7), sun = addDays(mon, 6);
  return { mon: toKey(mon), sun: toKey(sun) };
}
function weekSum(g, range){
  return state.records.reduce(function(s, r){ return r.goalId === g.id && r.date >= range.mon && r.date <= range.sun ? s + r.amount : s; }, 0);
}
function activeDays(g, range){
  var days = {};
  state.records.forEach(function(r){ if (r.goalId === g.id && r.date >= range.mon && r.date <= range.sun) days[r.date] = 1; });
  return Object.keys(days).length;
}
function minutesSum(g, range){
  return state.records.reduce(function(s, r){ return r.goalId === g.id && r.date >= range.mon && r.date <= range.sun ? s + (+r.minutes || 0) : s; }, 0);
}
function relDate(k){
  if (k === todayKey()) return "今天";
  if (k === toKey(addDays(fromKey(todayKey()), -1))) return "昨天";
  var d = Math.round((fromKey(todayKey()) - fromKey(k)) / 86400000);
  return d + " 天前";
}
function pct(g){ var t = +g.total || 0; if (t <= 0) return 0; return Math.min(100, Math.round(doneTotal(g) / t * 100)); }
function statusOf(g){
  if (remaining(g) <= 0) return { cls: "ok", t: "已完成" };
  if (daysLeft(g) <= 0) return { cls: "bad", t: "已逾期" };
  if (doneTotal(g) > 0) return { cls: "info", t: "进行中" };
  return { cls: "warn", t: "未开始" };
}
function deltaPct(cur, prev){
  if (prev <= 0) return cur > 0 ? "+" : "—";
  var d = Math.round((cur - prev) / prev * 100);
  return (d > 0 ? "+" : "") + d + "%";
}
function dayOfYear(){
  var t = new Date();
  return Math.floor((t - new Date(t.getFullYear(), 0, 0)) / 86400000);
}
function examDays(){
  var ed = state.obsidianInfo && state.obsidianInfo.examDate;
  if (!ed) return null;
  var p = ed.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
  var t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d.getTime() - t.getTime()) / 86400000);
}
function todaySentence(){
  var bank = state.settings.sentenceBank || [];
  if (state.settings.dailySentence) return state.settings.dailySentence;
  if (bank.length) return bank[dayOfYear() % bank.length];
  return "";
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function $(id){ return document.getElementById(id); }
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2200);
}
function openModal(html){ $("modalWrap").innerHTML = html; $("modalWrap").hidden = false; document.body.style.overflow = "hidden"; }
function closeModal(){ $("modalWrap").innerHTML = ""; $("modalWrap").hidden = true; document.body.style.overflow = ""; }

function todayOverview(){
  var today = todayKey();
  var connected = !!(state.obsidianInfo && state.obsidianInfo.dir);
  var manual = state.goals.filter(function(g){ return !(g.obsidian && connected); });
  var doneN = manual.filter(function(g){ return amountOn(g.id, today) > 0; }).length;
  var todayMin = state.records.reduce(function(s, r){ return r.date === today ? s + (+r.minutes || 0) : s; }, 0);
  var activeN = state.goals.filter(function(g){ return remaining(g) > 0; }).length;
  var best = 0;
  state.goals.forEach(function(g){ var st = streak(g); if (st > best) best = st; });
  return '<div class="ov-grid">' +
    '<div class="ov"><span class="ov-v">' + doneN + '/' + manual.length + '</span><span class="ov-k">今日已打卡</span></div>' +
    '<div class="ov"><span class="ov-v">' + todayMin + '</span><span class="ov-k">今日投入（分钟）</span></div>' +
    '<div class="ov"><span class="ov-v">' + activeN + '</span><span class="ov-k">进行中目标</span></div>' +
    '<div class="ov"><span class="ov-v">' + best + '</span><span class="ov-k">最长连续（天）</span></div>' +
    '</div>';
}
function weekRhythm(){
  var cur = weekRange(0);
  var names = ["一", "二", "三", "四", "五", "六", "日"];
  var cells = [], totalMin = 0;
  for (var i = 0; i < 7; i++){
    var k = toKey(addDays(fromKey(cur.mon), i));
    var recs = state.records.filter(function(r){ return r.date === k; });
    var mins = recs.reduce(function(s, r){ return s + (+r.minutes || 0); }, 0);
    totalMin += mins;
    var has = recs.length > 0;
    cells.push('<div class="rh-cell' + (has ? " on" : "") + (k === todayKey() ? " today" : "") + '">' +
      '<span class="rh-d">' + names[i] + '</span>' +
      '<span class="rh-c">' + (has ? (mins ? mins + "分" : "✓") : "·") + '</span></div>');
  }
  return '<div class="card rhythm"><div class="rh-head"><b>本周打卡节奏</b><span>本周已投入 ' + totalMin + ' 分钟</span></div>' +
    '<div class="rh-grid">' + cells.join("") + '</div></div>';
}
function missCard(g, mi){
  var isRed = mi.type === "overdue";
  var title = isRed ? "已断更 " + mi.days + " 天" : (mi.type === "rest" ? "昨天是休息日" : "昨天漏打卡了");
  var sub = isRed
    ? esc(g.name) + " 连续记录已中断 " + mi.days + " 天。补记昨天的量可挽回进度，或调整目标让计划更现实。"
    : (mi.type === "rest" ? "昨天是休息日，不计断更，今天正常打卡即可。" : "首次漏打不断更，今天补上，连续天数不受影响。");
  var btns = "";
  if (mi.type !== "rest"){
    btns = '<button class="btn sm" data-goal="' + g.id + '" data-act="backfill">补记昨天</button>';
    btns += isRed
      ? '<button class="btn sm ghost" data-goal="' + g.id + '" data-act="adjust">调整目标</button>'
      : '<button class="btn sm ghost" data-goal="' + g.id + '" data-act="dismiss">今天开始</button>';
  }
  return '<div class="card miss ' + (isRed ? "red" : "yellow") + '">' +
    '<div class="miss-head"><span class="miss-dot"></span><b>' + esc(title) + '</b></div>' +
    '<p>' + sub + '</p>' +
    (btns ? '<div class="miss-acts">' + btns + '</div>' : "") + '</div>';
}
function blogLink(g){
  var SECTIONS = { "数据结构": "数据结构", "计算机组成原理": "计算机组成原理", "操作系统": "操作系统", "计算机网络": "计算机网络" };

  return '<a class="blink" href="/kb/考研/' + encodeURIComponent(m[1]) + '/" target="_blank" rel="noopener">博客笔记 ↗</a>';

function goalCard(g){
  var connected = !!(state.obsidianInfo && state.obsidianInfo.dir);
  var auto = !!g.obsidian && connected;
  var sug = auto ? null : suggest(g);
  var st = statusOf(g);
  var e = eta(g);
  var et = e === null ? "暂无推算" : (remaining(g) <= 0 ? "已完成" : fmtDate(e));
  var sugLabel = sug && sug.note ? "今日建议量（" + sug.note + "）" : "今日建议量";
  var recHtml = "";
  if (!auto){
    var recs = recsOn(g.id, todayKey());
    if (recs.length){
      recHtml = '<div class="reclist"><div class="rl-title">今日已记录 ' + recs.length + ' 次</div>' + recs.map(function(r){
        return '<div class="rec"><span class="amt">' + r.amount + ' ' + esc(g.unit) + '</span>' +
          '<span class="tag ttag">' + typeName(r.type) + '</span>' +

      }).join("") + '</div>';

  var obs = "";

  var sub = "";

    if (g.obsidian === "math-notes"){
      var ch = state.obsidianInfo.mathChapters || [];
      if (ch.length){
        var f = ch[0].slice(0, 2), l = ch[ch.length - 1].slice(0, 2);

      }
    } else if (g.obsidian === "sentence" && state.obsidianInfo.sentenceLast){

  var autoHint = auto ? '<div class="auto-hint">' +
    'Obsidian 统计 · 已完成 ' + autoCount(g) + '/' + g.total + ' ' + esc(g.unit) + '</div>' + sub
    : (g.obsidian ? '<div class="auto-hint">Obsidian 未连接 · 暂用手动打卡，连接后自动同步</div>' : "");
  var gact = "";
  if (!auto){
    var disabled = sug.v <= 0;
    gact = '<div class="gact">' +
      '<div class="field f-amt"><label>' + sugLabel + '</label><div class="unit-holder"><input id="amt-' + g.id + '" type="number" inputmode="numeric" min="0" value="' + sug.v + '"' + (disabled ? ' disabled' : '') + '><span class="u">' + esc(g.unit) + '</span></div></div>' +
      '<div class="field f-content"><label>学习内容（选填）</label><input id="content-' + g.id + '" type="text" placeholder="如：02-例9 有理化" style="width:100%"></div>' +
      '<div class="field f-min"><label>分钟</label><input id="min-' + g.id + '" type="number" inputmode="numeric" min="0" placeholder="0"></div>' +
      '<div class="ttype" data-goal="' + g.id + '">' + REC_TYPES.map(function(t, i){
        return '<button type="button" class="tt' + (i === 0 ? " on" : "") + '" data-goal="' + g.id + '" data-tt="' + t[0] + '">' + t[1] + '</button>';
      }).join("") + '<button class="btn primary" data-goal="' + g.id + '" data-act="checkin"' + (disabled ? ' disabled' : '') + '>打卡</button></div>' +
      '</div>' +
      '<div class="gadd"><button class="btn plain" data-goal="' + g.id + '" data-act="backfill">补记最近 6 天</button></div>';
  }
  var streakTxt = auto ? '<span style="font-size:16px;color:var(--ink2);font-weight:600">自动</span>' : streak(g) + " 天";
  return '<div class="card gcard" style="--gc:' + g.color + '">' +
    '<div class="ghead"><span class="gdot"></span><span class="gname">' + esc(g.name) + '</span>' +
    blogLink(g) +
    '<span class="chip ' + st.cls + '">' + st.t + '</span></div>' +
    '<div class="gbar"><div class="gfill" style="width:' + pct(g) + '%;background:' + g.color + '"></div></div>' +
    autoHint +
    '<div class="gmeta">' +
      '<div class="cell"><span class="k">完成率</span><span class="v">' + pct(g) + '% <small>' + doneTotal(g) + '/' + g.total + '</small></span></div>' +
      '<div class="cell"><span class="k">连续天数</span><span class="v">' + streakTxt + '</span></div>' +
      '<div class="cell"><span class="k">预计完成</span><span class="v" style="font-size:16px">' + et + '</span></div>' +
    '</div>' +
    gact + recHtml + obs + '</div>';
}

function heat35(){
  var t = fromKey(todayKey());
  var thisMon = addDays(t, -(weekdayCN(t) - 1));
  var start = addDays(thisMon, -28);
  var weeks = [], maxMin = 0;
  for (var w = 0; w < 5; w++){
    var row = [];
    for (var d = 0; d < 7; d++){
      var k = toKey(addDays(start, w * 7 + d));
      var mins = state.records.reduce(function(s, r){ return r.date === k ? s + (+r.minutes || 0) : s; }, 0);
      row.push({ k: k, mins: mins });
      if (mins > maxMin) maxMin = mins;
    }
    weeks.push(row);
  }
  function lvl(m){
    if (m <= 0) return 0;

    }

function chart14(){
  var t = fromKey(todayKey()), days = [];
  for (var i = 13; i >= 0; i--) days.push(toKey(addDays(t, -i)));
  var rows = state.goals.map(function(g){
    return { g: g, vals: days.map(function(k){ var m = minutesOn(g.id, k), a = amountOn(g.id, k); return m || a || 0; }) };
  });
  var dayTot = [], max = 0;
  for (var di = 0; di < 14; di++){
    var t = 0;
    rows.forEach(function(r){ t += r.vals[di]; });
    dayTot.push(t);
    if (t > max) max = t;
  }
  if (max < 1) max = 1;
  var W = 700, H = 220, ml = 28, mr = 28, mt = 16, mb = 26;
  var pw = W - ml - mr, ph = H - mt - mb;
  var bw = pw / 14;
  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="近14天打卡量堆叠柱状图">';
  for (var gv = 0; gv <= 4; gv++){
    var y = mt + ph - gv / 4 * ph;
    var val = gv / 4 * max;
    var lab = val >= 10 ? Math.round(val).toString() : val.toFixed(1);
    svg += '<line x1="' + ml + '" y1="' + y.toFixed(1) + '" x2="' + (W - mr) + '" y2="' + y.toFixed(1) + '" stroke="#EDF4F1" stroke-width="1"/>';
    svg += '<text x="' + (ml - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#9AAFA9">' + lab + '</text>';
  }
  for (var di = 0; di < 14; di++){
    var x = ml + di * bw + 2, w = bw - 4, yB = mt + ph, stack = 0;
    rows.forEach(function(r){
      var v = r.vals[di];
      if (!v) return;
      var hh = Math.max(2, v / max * ph);
      var yy = yB - stack - hh;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + r.g.color + '"><title>' + esc(r.g.name) + ' ' + v + '</title></rect>';
      stack += hh;
    });
    svg += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#9AAFA9">' + fmtShort(days[di]) + '</text>';
  }
  svg += '</svg>';
  return svg;
}

function minSum(range){ var s=0; state.records.forEach(function(r){ if(r.date>=range.mon && r.date<=range.sun && r.mins) s+=r.mins; }); return s; }
function activeDaysAll(range){ var days={}; state.records.forEach(function(r){ if(r.date>=range.mon && r.date<=range.sun) days[r.date]=1; }); return Object.keys(days).length; }
function renderWeek(){
  var cur = weekRange(0), prev = weekRange(-1);
  var h = '<div class="card"><div class="weekhead">本周 ' + fmtDate(cur.mon) + ' – ' + fmtDate(cur.sun) + '（周一开始）</div>';
  var curAll = 0, prevAll = 0, over = 0, best = 0;
  state.goals.forEach(function(g){
    var c = weekSum(g, cur), p = weekSum(g, prev);
    curAll += c; prevAll += p;
    var dcls = c > p ? "up" : (c < p ? "down" : "flat");
    var cDays = activeDays(g, cur), pDays = activeDays(g, prev);
    var cMin = minutesSum(g, cur), pMin = minutesSum(g, prev);
    h += '<div class="wrow"><span class="gdot" style="background:' + g.color + '"></span>' +
      '<div class="wn-wrap"><span class="wn">' + esc(g.name) + '</span>' +
      '<div class="wline">本周 <b>+' + c + '</b> ' + esc(g.unit) + ' · 打卡 ' + cDays + ' 天 · ' + cMin + ' 分钟</div>' +
      '<div class="wline dim">上周 +' + p + ' ' + esc(g.unit) + ' · 打卡 ' + pDays + ' 天 · ' + pMin + ' 分钟</div></div>' +
      '<span class="delta ' + dcls + '">' + deltaPct(c, p) + '</span></div>';
    var mi = missInfo(g);
    if (mi && mi.type === "overdue") over++;
    var s = streak(g);
    if (s > best) best = s;
  });
  var active = 0;
  for (var dd = 0; dd < 7; dd++){
    var k = toKey(addDays(fromKey(cur.mon), dd));
    if (state.records.some(function(r){ return r.date === k; })) active++;
  }
  h += '</div>';
  h += '<div class="week-compare">' +
    '<span>本周 <b>' + curAll + '</b> 次 · ' + active + ' 天 · ' + minSum(cur) + ' 分钟</span>' +
    '<span class="dim">上周 ' + prevAll + ' 次 · ' + activeDaysAll(prev) + ' 天 · ' + minSum(prev) + ' 分钟</span>' +
    '<span class="delta ' + (curAll > prevAll ? 'up' : (curAll < prevAll ? 'down' : 'flat')) + '">' + deltaPct(curAll, prevAll) + '</span>' +
    '</div>';
  var tDist = REC_TYPES.map(function(t){
    var n = 0, m = 0;
    state.records.forEach(function(r){
      if (r.date >= cur.mon && r.date <= cur.sun && r.type === t[0]){ n++; m += (+r.minutes || 0); }
    });
    return { key: t[0], name: t[1], n: n, m: m };
  });
  h += '<div class="card"><h3>本周类型分布</h3><div class="tdist">' + tDist.map(function(t){
    return '<div class="td-cell"><span class="td-name">' + t.name + '</span><span class="td-n">' + t.n + ' 次</span><span class="td-m">' + t.m + ' 分钟</span></div>';
  }).join("") + '</div></div>';
  h += '<div class="card"><h3>周报文本</h3><textarea id="weekOut" class="weekout" readonly></textarea>' +
    '<div style="margin-top:10px"><button class="btn block" data-act="gen-week">生成并复制周报文本</button></div></div>';
  var rv = state.reviews[cur.mon] || { keep: "", problem: "", try: "", plan: "" };
  h += '<div class="card"><h3>本周复盘 · Keep / Problem / Try / 预案</h3>' +
    '<label class="rlab">保持 Keep · 做得好的，下周继续</label><textarea id="rvKeep" rows="2" placeholder="例：单词连续 6 天没断">' + esc(rv.keep) + '</textarea>' +
    '<label class="rlab">问题 Problem · 卡在哪了</label><textarea id="rvProblem" rows="2" placeholder="例：阅读总拖到睡前，一躺下就刷手机">' + esc(rv.problem) + '</textarea>' +
    '<label class="rlab">尝试 Try · 下周试试这样改</label><textarea id="rvTry" rows="2" placeholder="例：阅读改到午饭后 20 分钟">' + esc(rv.try) + '</textarea>' +
    '<label class="rlab">下周预案 · 如果…我就…</label><textarea id="rvPlan" rows="2" placeholder="例：如果睡前想刷手机，我就先读 2 页">' + esc(rv.plan) + '</textarea>' +
    '<div style="margin-top:10px"><button class="btn block" data-act="save-review">保存复盘</button></div></div>';
  $("tab-week").innerHTML = h;
  $("weekOut").value = buildWeekText(cur, prev, curAll, prevAll, over, best);
}

function buildWeekText(cur, prev, curAll, prevAll, over, best){
  var connected = !!(state.obsidianInfo && state.obsidianInfo.dir);
  var L = [];
  L.push("【考研学习周报】" + fmtDate(cur.mon) + " – " + fmtDate(cur.sun));
  var ed = examDays();
  L.push("");
  L.push("一、本周打卡");
  var autos = state.goals.filter(function(g){ return g.obsidian && connected; });
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var c = weekSum(g, cur);
    L.push("· " + g.name + "：" + c + " / " + g.total + " " + g.unit + "（本周 +" + c + "）");
  });
  if (autos.length) L.push("· Obsidian 自动统计：" + autos.map(function(g){ return g.name; }).join("、") + "（进度随 Obsidian 更新，无需打卡）");
  L.push("");
  L.push("二、比上周：" + deltaPct(curAll, prevAll) + "（本周总计 " + curAll + "）");
  var tcount = { study: 0, review: 0, practice: 0, recite: 0 };
  state.records.forEach(function(r){ if (r.date >= cur.mon && r.date <= cur.sun && tcount[r.type] != null) tcount[r.type]++; });
  L.push("· 本周类型：学习 " + tcount.study + " 次 · 复习 " + tcount.review + " 次 · 练习 " + tcount.practice + " 次 · 背诵 " + tcount.recite + " 次");
  L.push("");
  L.push("三、复盘");
  var bg = null, bc = -1;
  state.goals.forEach(function(g){ if (g.obsidian && connected) return; var c = weekSum(g, cur); if (c > bc) { bc = c; bg = g; } });
  if (bg) L.push("· 完成最好：" + bg.name + "（" + bc + "）");
  var bads = state.goals.filter(function(g){ return !(g.obsidian && connected) && weekSum(g, cur) <= 0; });
  if (bads.length) L.push("· 需要加强：" + bads.map(function(g){ return g.name; }).join("、") + "（本周未打卡）");
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var e2 = eta(g), rem2 = remaining(g);
    if (e2 && rem2 > 0){
      var dl = new Date(g.deadline + "T00:00:00"), ev = new Date(e2 + "T00:00:00");
      var diff = Math.round((dl.getTime() - ev.getTime()) / 86400000);
      if (diff > 0) L.push("· 进度超前：" + g.name + " 预计 " + fmtDate(e2) + " 完成，比截止提前 " + diff + " 天");
      else if (diff < 0) L.push("· 进度告急：" + g.name + " 按当前速度将逾期 " + (-diff) + " 天，建议每天加大到 ≥ " + suggest(g).v + " " + g.unit);
    }
  });
  L.push("· 最长连续：" + best + " 天" + (over ? "；逾期目标 " + over + " 个" : ""));
  L.push("");
  L.push("四、下周建议");
  state.goals.forEach(function(g){
    if (g.obsidian && connected) return;
    var sg = suggest(g);
    if (sg.v > 0) L.push("· " + g.name + "：建议每日 ≥ " + sg.v + " " + g.unit);
    else if (sg.note) L.push("· " + g.name + "：" + sg.note);
  });
  if (over) L.push("· 先把逾期目标补记或调整，别让它拖进度。");
  var rv = state.reviews && state.reviews[cur.mon];
  if (rv && (rv.keep || rv.problem || rv.try || rv.plan)){
    L.push("");
    L.push("五、手写复盘");
    if (rv.keep) L.push("· Keep：" + rv.keep);
    if (rv.problem) L.push("· Problem：" + rv.problem);
    if (rv.try) L.push("· Try：" + rv.try);
    if (rv.plan) L.push("· 预案：" + rv.plan);
  }
  return L.join("\n");
}

}
function openGoalModal(gid){
  var g = gid ? getGoal(gid) : null;
  var gObsCustom = g && g.obsidian && (g.obsidian.indexOf("dir:") === 0 || g.obsidian.indexOf("tbl:") === 0);
  var gObsPath = "";
  if (gObsCustom){ var pm = /^(?:dir:|tbl:)(.+)$/.exec(g.obsidian); gObsPath = pm ? pm[1] : ""; }
  var palette = ["#2563EB", "#4A90D9", "#E8A33D", "#E25B5B", "#7FB069", "#E882B0", "#C77D5A"];
  var sw = palette.map(function(c){
    return '<button type="button" class="sw' + ((g && g.color === c) || (!g && c === "#2563EB") ? " sel" : "") + '" data-color="' + c + '" style="background:' + c + '" aria-label="颜色 ' + c + '"></button>';
  }).join("");
  openModal(
    '<div class="modal"><h3>' + (g ? "编辑目标" : "添加目标") + '</h3>' +
    (g ? "" : '<div class="mfield"><label>常用模板 · 点击预填</label><div class="tmpls">' +
      [["政治 · 肖 1000 题", "题", 1000], ["英语 · 真题阅读", "篇", 80], ["英语 · 作文", "篇", 30], ["数学 · 真题", "套", 40], ["408 · 真题", "套", 20], ["408 · 王道一轮", "轮", 3]]
      .map(function(t){ return '<button type="button" class="tmpl" data-tmpl="' + t.join("|") + '">' + t[0] + '</button>'; }).join("") + '</div></div>') +
    '<div class="mfield"><label>目标名称</label><input id="glName" maxlength="20" value="' + esc(g ? g.name : "") + '" placeholder="如 政治 · 肖 1000 题"></div>' +
    '<div class="mrow">' +
    '<div class="mfield"><label>单位</label><input id="glUnit" maxlength="4" value="' + esc(g ? g.unit : "次") + '"></div>' +
    '<div class="mfield"><label>总量</label><input id="glTotal" type="number" inputmode="numeric" min="1" value="' + (g ? g.total : "") + '"></div>' +
    '</div>' +
    '<div class="mfield"><label>截止日期</label><input id="glDeadline" type="date" value="' + (g ? g.deadline : "2027-12-20") + '"></div>' +
    '<div class="mfield"><label>自动统计来源（可选）</label><select id="glObsidian">' +
      '<option value="">无（手动打卡）</option>' +
      '<option value="math-notes"' + (g && g.obsidian === "math-notes" ? " selected" : "") + '>数学讲义（章节文件数）</option>' +
      '<option value="sentence"' + (g && g.obsidian === "sentence" ? " selected" : "") + '>每日一句（进度表行数）</option>' +
      '<option value="dir:"' + (gObsCustom && g.obsidian.indexOf("dir:") === 0 ? " selected" : "") + '>自定义目录（章节文件数）</option>' +
      '<option value="tbl:"' + (gObsCustom && g.obsidian.indexOf("tbl:") === 0 ? " selected" : "") + '>自定义文件（进度表行数）</option>' +
    '</select>' +
    '<input id="glObsPath" class="obs-path" maxlength="80" placeholder="Obsidian 内路径（相对 Vault 根），如 考研/数学/零基础通关讲义"' +
      ' value="' + esc(gObsPath) + '" style="display:' + (gObsCustom ? "block" : "none") + '">' +
    '</div>' +
    '<div class="mfield"><label>配色</label><div class="swatches">' + sw + '</div></div>' +
    '<div class="mfield"><label>障碍（可选）</label><input id="glObs" maxlength="60" value="' + esc(g ? g.obstacle : "") + '" placeholder="最近卡在哪"></div>' +
    '<div class="mfield"><label>对策（可选）</label><input id="glCnt" maxlength="60" value="' + esc(g ? g.countermeasure : "") + '" placeholder="打算怎么解决"></div>' +
    '<div class="macts"><button class="btn" data-act="save-goal">保存</button><button class="btn ghost" data-act="close-modal">取消</button></div></div>'
  );
  window._goalId = gid || null;
  document.querySelectorAll(".sw").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".sw").forEach(function(x){ x.classList.remove("sel"); });
      b.classList.add("sel");
    });
  });
  document.querySelectorAll(".tmpl").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-tmpl").split("|");
      $("glName").value = p[0]; $("glUnit").value = p[1]; $("glTotal").value = p[2];
      toast("已预填，可按需修改");
    });
  });
  var obsSel = $("glObsidian");
  if (obsSel) obsSel.addEventListener("change", function(){
    var v = obsSel.value, inp = $("glObsPath");
    if (inp) inp.style.display = (v === "dir:" || v === "tbl:") ? "block" : "none";
  });
}
function saveGoal(){
  var name = $("glName").value.trim();
  var unit = $("glUnit").value.trim() || "次";
  var total = +($("glTotal").value) || 0;
  var deadline = $("glDeadline").value;
  if (!name){ toast("请填写目标名称"); return; }
  if (total <= 0){ toast("总量需大于 0"); return; }
  if (!deadline){ toast("请选择截止日期"); return; }
  var color = "#2563EB";
  var sel = document.querySelector(".sw.sel");
  if (sel) color = sel.getAttribute("data-color");
  var obsVal = $("glObsidian").value;
  if (obsVal === "dir:" || obsVal === "tbl:"){
    var p = ($("glObsPath") && $("glObsPath").value.trim()) || "";
    if (!p){ toast("请填写 Obsidian 内路径（相对 Vault 根）"); return; }
    obsVal = obsVal + p;
  }
  var id = window._goalId;
  if (id){
    var g = getGoal(id);
    if (g){ g.name = name; g.unit = unit; g.total = total; g.deadline = deadline; g.color = color;
      g.obsidian = obsVal;
      g.obstacle = $("glObs").value.trim(); g.countermeasure = $("glCnt").value.trim(); }
  } else {
    state.goals.push({ id: uid(), name: name, unit: unit, total: total, deadline: deadline, color: color,
      base: 0, obsidian: obsVal,
      obstacle: $("glObs").value.trim(), countermeasure: $("glCnt").value.trim() });
  }
  save(); closeModal(); render(); toast("已保存");
  if (state.obsidianInfo && state.obsidianInfo.dir && state.goals.some(function(x){ return x.obsidian; })) obsRefresh(true);
}
function confirmDel(gid){
  var g = getGoal(gid); if (!g) return;
  confirmBox("删除目标「" + g.name + "」？该目标的打卡记录也会一并删除。", function(){
    state.goals = state.goals.filter(function(x){ return x.id !== gid; });
    state.records = state.records.filter(function(r){ return r.goalId !== gid; });
    save(); render(); toast("已删除");
  });
}

function exportData(){
  state.lastBackup = Date.now(); save();
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "study-backup-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast("备份已下载");
}
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){}, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  ta.remove();
}
function copyBackup(){ state.lastBackup = Date.now(); save(); copyText(JSON.stringify(state)); toast("备份文本已复制"); }
function importData(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var s = JSON.parse(reader.result);
      if (!s || !Array.isArray(s.goals)) throw new Error("bad");
      var backup = JSON.stringify(state);
      confirmBox("导入将覆盖当前数据（当前数据会先复制到剪贴板备存）。确认导入？", function(){
        try { if (navigator.clipboard) navigator.clipboard.writeText(backup); } catch(e){}
        state = normalize(s);
        save(); render(); toast("导入成功");
      });
    } catch(e){ toast("文件格式不对，未导入"); }
    input.value = "";
  };
  reader.readAsText(f, "utf-8");
}
function confirmReset(){
  confirmBox("清空全部打卡数据？此操作不可恢复（可先「导出备份」）。", function(){
    state = defaultState(); save(); render(); toast("已清空");
  });
}
function genWeek(){
  var cur = weekRange(0), prev = weekRange(-1);
  var curAll = 0, prevAll = 0, over = 0, best = 0;
  state.goals.forEach(function(g){
    curAll += weekSum(g, cur); prevAll += weekSum(g, prev);
    var mi = missInfo(g);
    if (mi && mi.type === "overdue") over++;
    var s = streak(g);
    if (s > best) best = s;
  });
  $("weekOut").value = buildWeekText(cur, prev, curAll, prevAll, over, best);
  copyText($("weekOut").value);
  toast("周报文本已复制");
}
function switchTab(name){
  ["today", "board", "week", "mine"].forEach(function(t){ $("tab-" + t).hidden = t !== name; });
  document.querySelectorAll(".tab-btn").forEach(function(b){
    var on = b.getAttribute("data-tab") === name;
    b.classList.toggle("active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}

/* ================= 事件与启动 ================= */
function boot(){
  document.addEventListener("click", function(e){
    if (e.target && e.target.id === "modalWrap"){ closeModal(); return; }
    if (e.target && e.target.classList && e.target.classList.contains("tt")){
      var host = e.target.closest ? e.target.closest(".ttype") : null;
      if (host){ host.querySelectorAll(".tt").forEach(function(x){ x.classList.remove("on"); }); e.target.classList.add("on"); }
      return;
    }
    var el = e.target.closest ? e.target.closest("[data-act],[data-tab]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    var tab = el.getAttribute("data-tab");
    if (tab){ switchTab(tab); return; }
    if (act === "confirm-yes"){ var cb = window._confirmYes; closeModal(); window._confirmYes = null; if (cb) cb(); return; }
    if (act === "confirm-no"){ closeModal(); window._confirmYes = null; return; }
    if (act === "close-modal"){ closeModal(); return; }
    var gid = el.getAttribute("data-goal");
    if (gid){
      if (act === "checkin"){ doCheckin(gid); return; }
      if (act === "backfill"){ openBackfill(gid); return; }
      if (act === "dismiss"){ state.dismissed[gid] = todayKey(); save(); render(); toast("已忽略，今天开始"); return; }
      if (act === "adjust"){ openGoalModal(gid); return; }
      if (act === "edit-goal"){ openGoalModal(gid); return; }
      if (act === "del-goal"){ confirmDel(gid); return; }
    }
    if (act === "add-goal"){ openGoalModal(null); return; }
    if (act === "save-goal"){ saveGoal(); return; }
    if (act === "save-backfill"){ saveBackfill(); return; }
    if (act === "export"){ exportData(); return; }
    if (act === "copy-backup"){ copyBackup(); return; }
    if (act === "import"){ $("importFile").click(); return; }
    if (act === "reset"){ confirmReset(); return; }
    if (act === "gen-week"){ genWeek(); return; }
    if (act === "save-review"){ saveReview(); return; }
    if (act === "obs-connect"){ obsConnect(); return; }
    if (act === "obs-refresh"){ obsRefresh(false); return; }
    if (act === "obs-disconnect"){ obsDisconnect(); return; }
    if (act === "add-leave"){
      var d = $("leaveDate").value, n = $("leaveNote").value.trim();
      if (!d){ toast("选日期"); return; }
      state.settings.leaveDays = state.settings.leaveDays || [];
      state.settings.leaveDays.push({ date: d, note: n });
      save(); render(); toast("已记请假"); return;
    }
  });
  document.addEventListener("change", function(e){
    if (e.target && e.target.id === "restDay"){ state.settings.restWeekday = +e.target.value; save(); render(); toast("休息日已更新"); }
    if (e.target && e.target.id === "importFile"){ importData(e.target); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeModal();
  });
  render();
  try { obsInit(); } catch(e){}
}
if (typeof document !== "undefined" && typeof window !== "undefined"){
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
</script>
</body>
</html>
